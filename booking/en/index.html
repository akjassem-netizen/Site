      <a href="https://akjassem.com/en/" class="back-home-btn" id="backBtnText">&larr; Home</a>
    </div>
  </header>

  <main class="form-container">
    <div class="brand-logo-box" dir="ltr">
      <div class="b-akh">A<span class="red-k">K</span>H</div>
      <div class="b-sub"><span class="red-slash">/</span> LAW OFFICE</div>
      <div class="b-est">EST. 2014</div>
    </div>

    <h1 id="formMainTitle">Legal Consultation Request Form</h1>
    <p class="instructions" id="formInstructions">Please fill out the form below accurately so that we can review your request, determine fees, and schedule the consultation professionally.</p>

    <form id="consultationForm">

      <div class="form-group">
        <label id="lblCitizenship">Citizenship / Personal Status *</label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="citizenship" value="iraqi" checked onchange="updateFormDisplay()"> <span id="optIraqi">Iraqi (Citizen)</span></label>
          <label class="radio-label"><input type="radio" name="citizenship" value="foreign" onchange="updateFormDisplay()"> <span id="optForeign">Foreigner (Non-Iraqi)</span></label>
        </div>
      </div>

      <div class="form-group">
        <label id="lblResidence">Current Residence *</label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="residence" value="inside" checked> <span id="optInside">Resident inside Iraq</span></label>
          <label class="radio-label"><input type="radio" name="residence" value="outside"> <span id="optOutside">Resident outside Iraq</span></label>
        </div>
      </div>

      <div class="form-group">
        <label id="lblEntityType">Requester Status *</label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="entityType" value="individual" checked onchange="updateFormDisplay()"> <span id="optIndiv">Individual</span></label>
          <label class="radio-label"><input type="radio" name="entityType" value="company" onchange="updateFormDisplay()"> <span id="optComp">Corporation / Business Entity</span></label>
        </div>
      </div>

      <div class="form-group">
        <label id="nameLabel">Full Name *</label>
        <input type="text" id="fullName" required placeholder="Enter full name">
      </div>

      <div id="companyRepField" class="form-group conditional-section">
        <label id="lblCompanyRep">Authorized Representative / Signatory *</label>
        <input type="text" id="companyRepName" placeholder="Name of responsible representative">
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label id="lblEmail">Email Address *</label>
          <input type="email" id="email" required placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label id="lblPhone">Phone / WhatsApp *</label>
          <input type="tel" id="phone" required placeholder="Phone number with country code">
        </div>
      </div>

      <div id="individualOnlyFields" class="conditional-section active">
        <div class="form-grid">
          <div class="form-group">
            <label id="lblGender">Gender *</label>
            <select id="gender">
              <option value="male" id="optMale">Male</option>
              <option value="female" id="optFemale">Female</option>
            </select>
          </div>
          <div class="form-group">
            <label id="lblAge">Age *</label>
            <input type="number" id="age" placeholder="e.g., 35">
          </div>
        </div>

        <div class="form-group">
          <label id="lblEducation">Level of Education *</label>
          <select id="education">
            <option value="university" id="eduUni">University or Postgraduate Degree</option>
            <option value="highschool" id="eduHigh">High School</option>
            <option value="other" id="eduOther">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label id="lblOccupation">Occupation / Job *</label>
          <input type="text" id="occupation" placeholder="Enter your current occupation">
        </div>
      </div>

      <div class="form-group">
        <label id="lblAddress">Residential Address *</label>
        <input type="text" id="address" placeholder="Province / Area">
      </div>

      <div id="foreignerIndividualFields" class="conditional-section">
        <div class="form-group">
          <label id="lblNationalityIndiv">Nationality *</label>
          <input type="text" id="nationalityIndiv" placeholder="e.g., British / American / German">
        </div>
      </div>

      <div id="companyIdentityFields" class="conditional-section">
        <div class="form-group">
          <label id="lblCompanyRegAuth">Registration Authority *</label>
          <select id="companyRegAuth">
            <option value="federal" id="authFed">Registrar of Companies - Federal Government (Baghdad)</option>
            <option value="kurdistan" id="authKrg">Ministry of Trade and Industry - Kurdistan Region</option>
            <option value="foreign_corp" id="authForeign">Foreign / International Company Incorporated Outside Iraq</option>
          </select>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label id="lblCountryInc">Country of Incorporation *</label>
            <input type="text" id="countryInc" placeholder="e.g., Iraq / UAE / UK">
          </div>
          <div class="form-group">
            <label id="lblRegNo">Corporate Registration No. (CRN) *</label>
            <input type="text" id="regNo" placeholder="Certificate or Registration Number">
          </div>
        </div>
      </div>

      <div id="translationField" class="form-group conditional-section">
        <label id="lblTranslation">Translation & Linguistic Coordination *</label>
        <select id="translationNeeded">
          <option value="no" id="transNo">No, I can proceed directly</option>
          <option value="yes" id="transYes">Yes, I request a specialized translator provided by the office</option>
        </select>
      </div>

      <div class="form-group">
        <label id="lblMethod">Preferred Consultation Method *</label>
        <select id="consultationMethod">
          <option value="office" id="methOffice">Office Visit</option>
          <option value="phone" id="methPhone">Phone Call</option>
          <option value="online" id="methOnline">Online / Video Call</option>
        </select>
      </div>

      <div class="form-group">
        <label id="lblConsultType">Consultation Type / Legal Classification *</label>
        <select id="consultationType">
          <option value="corporate" id="typeCorp">Corporate, Commercial & Foreign Investment</option>
          <option value="civil_realestate" id="typeCivil">Civil & Real Estate Cases</option>
          <option value="criminal" id="typeCrim">Criminal & Penal Cases</option>
          <option value="personal" id="typePers">Personal Status (Family, Divorce, Estate)</option>
          <option value="other" id="typeOther">Other / General Consultation</option>
        </select>
      </div>

      <div class="form-group">
        <label id="lblDetails">Details of Your Case or Consultation Topic *</label>
        <textarea id="consultationDetails" placeholder="Briefly explain the facts of your case or legal consultation topic..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtnText">Submit Request for Legal Review &larr;</button>
    </form>
  </main>

  <!-- الفوتر ورابط سياسة الخصوصية -->
  <footer class="site-footer">
    <a href="/privacy/en/">Privacy Policy</a> | 
    <span>All Rights Reserved © 2026 AKH Law Office</span>
  </footer>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('preferredLang') || 'en';
      if (savedLang === 'ar') {
        window.location.href = '../';
        return;
      }
      if (bookingDict[savedLang]) {
        changeLanguage(savedLang);
      } else {
        changeLanguage('en');
      }
    });

    function changeLanguage(lang) {
      if (lang === 'ar') {
        localStorage.setItem('preferredLang', 'ar');
        window.location.href = '../';
        return;
      }
      localStorage.setItem('preferredLang', lang);

      const root = document.getElementById('htmlRoot');
      root.setAttribute('lang', lang);
      root.setAttribute('dir', (lang === 'ar' || lang === 'ku') ? 'rtl' : 'ltr');

      const t = bookingDict[lang] || bookingDict['en'];

      document.getElementById('pageTitle').innerText = t.title;
      document.getElementById('metaDesc').setAttribute('content', t.metaDesc);
      document.getElementById('ogTitle').setAttribute('content', t.title);
      document.getElementById('ogDesc').setAttribute('content', t.metaDesc);
      document.getElementById('twTitle').setAttribute('content', t.title);
      document.getElementById('twDesc').setAttribute('content', t.metaDesc);

      document.getElementById('backBtnText').innerText = "← " + t.back;
      document.getElementById('formMainTitle').innerText = t.formTitle;
      document.getElementById('formInstructions').innerText = t.formInst;
      
      document.getElementById('lblCitizenship').innerText = t.citizenship;
      document.getElementById('optIraqi').innerText = t.optIraqi;
      document.getElementById('optForeign').innerText = t.optForeign;
      
      document.getElementById('lblResidence').innerText = t.residence;
      document.getElementById('optInside').innerText = t.optInside;
      document.getElementById('optOutside').innerText = t.optOutside;

      document.getElementById('lblEntityType').innerText = t.entityType;
      document.getElementById('optIndiv').innerText = t.optIndiv;
      document.getElementById('optComp').innerText = t.optComp;
      
      document.getElementById('lblCompanyRep').innerText = t.companyRep;
      document.getElementById('lblEmail').innerText = t.email;
      document.getElementById('lblPhone').innerText = t.phone;
      document.getElementById('lblGender').innerText = t.gender;

      const genderVal = document.getElementById('gender').value;
      const educationVal = document.getElementById('education').value;
      const authVal = document.getElementById('companyRegAuth').value;
      const transVal = document.getElementById('translationNeeded').value;
      const methodVal = document.getElementById('consultationMethod').value;
      const consultTypeVal = document.getElementById('consultationType').value;

      document.getElementById('optMale').innerText = t.male;
      document.getElementById('optFemale').innerText = t.female;
      document.getElementById('lblAge').innerText = t.age;
      document.getElementById('lblEducation').innerText = t.education;
      document.getElementById('eduUni').innerText = t.eduUni;
      document.getElementById('eduHigh').innerText = t.eduHigh;
      document.getElementById('eduOther').innerText = t.eduOther;
      document.getElementById('lblOccupation').innerText = t.occupation;

      document.getElementById('lblNationalityIndiv').innerText = t.nationalityIndiv;
      document.getElementById('lblCountryInc').innerText = t.countryInc;
      document.getElementById('lblRegNo').innerText = t.regNo;
      document.getElementById('lblTranslation').innerText = t.translation;
      document.getElementById('authFed').innerText = t.authFed;
      document.getElementById('authKrg').innerText = t.authKrg;
      document.getElementById('authForeign').innerText = t.authForeign;
      document.getElementById('transNo').innerText = t.transNo;
      document.getElementById('transYes').innerText = t.transYes;

      document.getElementById('lblMethod').innerText = t.method;
      document.getElementById('methOffice').innerText = t.methOffice;
      document.getElementById('methPhone').innerText = t.methPhone;
      document.getElementById('methOnline').innerText = t.methOnline;

      document.getElementById('lblConsultType').innerText = t.consultType;
      document.getElementById('typeCorp').innerText = t.typeCorp;
      document.getElementById('typeCivil').innerText = t.typeCivil;
      document.getElementById('typeCrim').innerText = t.typeCrim;
      document.getElementById('typePers').innerText = t.typePers;
      document.getElementById('typeOther').innerText = t.typeOther;

      document.getElementById('lblDetails').innerText = t.details;
      document.getElementById('submitBtnText').innerHTML = t.submit;

      document.getElementById('gender').value = genderVal;
      document.getElementById('education').value = educationVal;
      document.getElementById('companyRegAuth').value = authVal;
      document.getElementById('translationNeeded').value = transVal;
      document.getElementById('consultationMethod').value = methodVal;
      document.getElementById('consultationType').value = consultTypeVal;

      document.getElementById('fullName').placeholder = t.phName;
      document.getElementById('email').placeholder = t.phEmail;
      document.getElementById('phone').placeholder = t.phPhone;
      document.getElementById('companyRepName').placeholder = t.phCompRep;
      document.getElementById('age').placeholder = t.phAge;
      document.getElementById('occupation').placeholder = t.phOcc;
      document.getElementById('nationalityIndiv').placeholder = t.phNat;
      document.getElementById('countryInc').placeholder = t.phCountry;
      document.getElementById('regNo').placeholder = t.phRegNo;
      document.getElementById('consultationDetails').placeholder = t.phDetails;

      document.getElementById('languageSelect').value = lang;

      updateFormDisplay();
    }

    function updateFormDisplay() {
      const isForeign = document.querySelector('input[name="citizenship"]:checked').value === 'foreign';
      const isCompany = document.querySelector('input[name="entityType"]:checked').value === 'company';
      
      const indFields = document.getElementById('individualOnlyFields');
      const compRepField = document.getElementById('companyRepField');
      const foreignIndivFields = document.getElementById('foreignerIndividualFields');
      const compIdentityFields = document.getElementById('companyIdentityFields');
      const translationField = document.getElementById('translationField');
      const nameLabel = document.getElementById('nameLabel');
      const addressLabel = document.getElementById('lblAddress');
      const addressInput = document.getElementById('address');
      
      const lang = document.getElementById('languageSelect').value;
      const t = bookingDict[lang] || bookingDict['en'];

      if (isCompany) {
        indFields.classList.remove('active');
        compRepField.classList.add('active');
        compIdentityFields.classList.add('active');
        foreignIndivFields.classList.remove('active');
        nameLabel.innerText = t.companyName;
        addressLabel.innerText = t.addressCompany;
        addressInput.placeholder = t.phAddrComp;
      } else {
        compRepField.classList.remove('active');
        compIdentityFields.classList.remove('active');
        if (isForeign) {
          indFields.classList.remove('active');
          foreignIndivFields.classList.add('active');
          nameLabel.innerText = t.fullName;
          addressLabel.innerText = t.addressForeignIndiv;
          addressInput.placeholder = t.phAddrForeign;
        } else {
          indFields.classList.add('active');
          foreignIndivFields.classList.remove('active');
          nameLabel.innerText = t.fullName;
          addressLabel.innerText = t.addressIraqiIndiv;
          addressInput.placeholder = t.phAddrIraqi;
        }
      }

      if (isForeign) {
        translationField.classList.add('active');
      } else {
        translationField.classList.remove('active');
      }
    }

    const bookingDict = {
      en: {
        title: "Book Consultation | Law Office of Ali Kadhem Hashimi - Baghdad",
        metaDesc: "Book a legal consultation appointment with the Law Office of Ali Kadhem Hashimi in Baghdad. Expert corporate and individual legal services.",
        back: "Home",
        formTitle: "Legal Consultation Request Form",
        formInst: "Please fill out this form accurately to enable us to review your request, determine fees, and schedule the consultation professionally.",
        citizenship: "Citizenship / Personal Status *",
        optIraqi: "Iraqi (Citizen)",
        optForeign: "Foreigner (Non-Iraqi)",
        residence: "Current Residence *",
        optInside: "Resident inside Iraq",
        optOutside: "Resident outside Iraq",
        entityType: "Requester Status *",
        optIndiv: "Individual",
        optComp: "Corporation / Business Entity",
