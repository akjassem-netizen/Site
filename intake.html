<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">AKH Intake - لوحة إدارة الاستشارات القانونية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f4f6f9; color: #070f1e; font-family: 'Cairo', sans-serif; min-height: 100vh; }

    /* شاشة الحماية والمصادقة */
    #loginOverlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #070f1e;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 20px;
    }
    .login-box {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      border-top: 6px solid #c5a059;
    }
    .login-box h2 { font-size: 20px; font-weight: 900; margin-bottom: 10px; color: #070f1e; }
    .login-box p { font-size: 12.5px; color: #64748b; margin-bottom: 25px; line-height: 1.6; }
    .login-input {
      width: 100%;
      height: 48px;
      padding: 0 15px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      margin-bottom: 15px;
      outline: none;
      text-align: center;
      background: #f8fafc;
    }
    .login-input:focus { border-color: #c5a059; background: #fff; }
    .login-btn {
      width: 100%;
      height: 48px;
      background: #070f1e;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 900;
      font-size: 15px;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      transition: background 0.2s;
    }
    .login-btn:hover { background: #c5a059; color: #070f1e; }
    .login-error { color: #d32f2f; font-size: 13px; font-weight: 700; margin-top: 12px; display: none; }

    /* لوحة التحكم الرئيسية */
    #dashboardContent { display: none; }

    header {
      background: #070f1e;
      border-bottom: 3px solid #c5a059;
      padding: 15px 35px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      width: 100%;
    }

    .brand-logo-box {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 8px 18px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }
    .b-akh {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #070f1e;
      font-family: Arial, sans-serif;
      line-height: 1.1;
    }
    .b-akh .red-k { color: #d32f2f; }
    .b-sub {
      font-size: 8px;
      font-weight: 800;
      color: #070f1e;
      letter-spacing: 1px;
      margin-top: 2px;
    }
    .b-sub .red-slash { color: #d32f2f; }

    .header-actions { display: flex; gap: 12px; align-items: center; }
    .lang-select {
      background: #070f1e;
      color: #fff;
      border: 1.5px solid #c5a059;
      padding: 7px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      outline: none;
    }
    .lang-select option { background: #070f1e; color: #fff; }

    .btn-refresh {
      background: #c5a059;
      color: #070f1e;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      transition: background 0.2s;
    }
    .btn-refresh:hover { background: #b8934f; }
    .btn-logout {
      background: #d32f2f;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
    }

    .container { max-width: 1400px; margin: 30px auto; padding: 0 25px; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      border-right: 5px solid #c5a059;
    }
    html[dir="ltr"] .stat-card { border-right: none; border-left: 5px solid #c5a059; }
    .stat-title { font-size: 13px; color: #64748b; font-weight: 700; margin-bottom: 5px; }
    .stat-value { font-size: 28px; font-weight: 900; color: #070f1e; }

    .table-card {
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      overflow: hidden;
    }
    .table-header-bar {
      padding: 18px 25px;
      background: #f8fafc;
      border-bottom: 1.5px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .table-header-bar h2 { font-size: 18px; font-weight: 900; color: #070f1e; }
    .search-box {
      padding: 8px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      width: 300px;
      font-family: 'Cairo', sans-serif;
      font-size: 13.5px;
      outline: none;
    }
    .search-box:focus { border-color: #c5a059; }

    table { width: 100%; border-collapse: collapse; text-align: right; }
    html[dir="ltr"] table { text-align: left; }
    th, td { padding: 15px 20px; border-bottom: 1px solid #e2e8f0; font-size: 13.5px; }
    th { background: #070f1e; color: #ffffff; font-weight: 800; }
    tr:hover { background: #fdfbf7; }

    .badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
    }
    .badge-pending { background: #fef3c7; color: #b45309; }
    .badge-accepted { background: #d1fae5; color: #065f46; }
    .badge-rejected { background: #fee2e2; color: #991b1b; }

    .action-btn {
      background: #070f1e;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .action-btn:hover { background: #c5a059; color: #070f1e; }

    /* Modal تفاصيل الطلب */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(7, 15, 30, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #ffffff;
      width: 100%;
      max-width: 800px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      border-top: 6px solid #c5a059;
      max-height: 90vh;
      overflow-y: auto;
      padding: 30px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; }
    .modal-header h3 { font-size: 20px; font-weight: 900; color: #070f1e; }
    .close-modal { background: none; border: none; font-size: 22px; font-weight: 900; cursor: pointer; color: #64748b; }
    .close-modal:hover { color: #d32f2f; }

    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .detail-item { background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; }
    .detail-item label { display: block; font-size: 11px; color: #64748b; font-weight: 800; margin-bottom: 4px; }
    .detail-item div { font-size: 14px; font-weight: 700; color: #070f1e; word-break: break-word; }
    .full-width { grid-column: span 2; }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 25px;
      border-top: 1px solid #e2e8f0;
      padding-top: 20px;
      flex-wrap: wrap;
    }
    .btn-accept { background: #065f46; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; }
    .btn-reject { background: #991b1b; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; }
    .btn-close-modal { background: #cbd5e1; color: #070f1e; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>

  <!-- شاشة الحماية والمصادقة -->
  <div id="loginOverlay">
    <div class="login-box" id="loginBoxContainer"></div>
  </div>

  <!-- لوحة التحكم الفعلية -->
  <div id="dashboardContent">
    <header>
      <div class="brand-logo-box" dir="ltr">
        <div class="b-akh">A<span class="red-k">K</span>H</div>
        <div class="b-sub"><span class="red-slash">/</span> INTAKE DESK</div>
      </div>
      <div class="header-actions">
        <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
          <option value="ar">العربية</option>
          <option value="en">English</option>
        </select>
        <button class="btn-refresh" onclick="loadData()" id="btnRefreshText">تحديث البيانات ⟳</button>
        <button class="btn-logout" onclick="logout()" id="btnLogoutText">قفل الجلسة 🔒</button>
      </div>
    </header>

    <div class="container">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-title" id="statTitle1">إجمالي الطلبات المستلمة</div>
          <div class="stat-value" id="totalCount">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-title" id="statTitle2">طلبات قيد المراجعة</div>
          <div class="stat-value" id="pendingCount">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-title" id="statTitle3">الطلبات المقبولة والمنجزة</div>
          <div class="stat-value" id="acceptedCount">0</div>
        </div>
      </div>

      <div class="table-card">
        <div class="table-header-bar">
          <h2 id="tableHeaderTitle">سجل طلبات الاستشارة الواردة</h2>
          <input type="text" id="searchInput" class="search-box" placeholder="ابحث بالاسم أو رقم الهاتف..." onkeyup="filterTable()">
        </div>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th id="thDate">التاريخ والوقت</th>
                <th id="thName">الاسم الكامل</th>
                <th id="thEntity">الصفة</th>
                <th id="thType">نوع الاستشارة</th>
                <th id="thPhone">رقم الهاتف</th>
                <th id="thStatus">الحالة</th>
                <th id="thActions">الإجراءات</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="7" style="text-align: center; padding: 30px; color: #64748b;" id="loadingText">جاري تحميل البيانات من النظام...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal تفاصيل الطلب -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle">تفاصيل طلب الاستشارة</h3>
        <button class="close-modal" onclick="closeModal()">&times;</button>
      </div>
      
      <div class="detail-grid" id="modalContent"></div>

      <div class="modal-actions">
        <button class="btn-accept" onclick="updateRequestStatus('مقبول - بانتظار تحديد الأتعاب والدفع')" id="btnAcceptModal">قبول الطلب وإرسال إشعار</button>
        <button class="btn-reject" onclick="updateRequestStatus('مرفوض / نعتذر عن الاستلام')" id="btnRejectModal">رفض الطلب واعتذار</button>
        <button class="btn-close-modal" onclick="closeModal()" id="btnCloseModal">إغلاق</button>
      </div>
    </div>
  </div>

  <script>
    const translations = {
      ar: {
        pageTitle: "AKH Intake - لوحة إدارة الاستشارات القانونية",
        refresh: "تحديث البيانات ⟳",
        logout: "قفل الجلسة 🔒",
        stat1: "إجمالي الطلبات المستلمة",
        stat2: "طلبات قيد المراجعة",
        stat3: "الطلبات المقبولة والمنجزة",
        tableTitle: "سجل طلبات الاستشارة الواردة",
        searchPh: "ابحث بالاسم أو رقم الهاتف...",
        thDate: "التاريخ والوقت",
        thName: "الاسم الكامل",
        thEntity: "الصفة",
        thType: "نوع الاستشارة",
        thPhone: "رقم الهاتف",
        thStatus: "الحالة",
        thActions: "الإجراءات",
        loading: "جاري تحميل البيانات من النظام...",
        reviewBtn: "مراجعة التفاصيل",
        modalTitlePrefix: "طلب المستشير: ",
        btnAccept: "قبول الطلب وإرسال إشعار",
        btnReject: "رفض الطلب واعتذار",
        btnClose: "إغلاق",
        company: "شركة تجارية",
        individual: "فرد طبيعي",
        promptText: "أدخل ملاحظات المكتب أو تفاصيل الأتعاب (سيتم إرسالها للعميل عبر البريد الإلكتروني):"
      },
      en: {
        pageTitle: "AKH Intake - Legal Consultations Management Dashboard",
        refresh: "Refresh Data ⟳",
        logout: "Lock Session 🔒",
        stat1: "Total Requests Received",
        stat2: "Pending Requests",
        stat3: "Accepted & Completed",
        tableTitle: "Incoming Consultation Requests Registry",
        searchPh: "Search by name or phone...",
        thDate: "Date & Time",
        thName: "Full Name",
        thEntity: "Entity Type",
        thType: "Consultation Type",
        thPhone: "Phone Number",
        thStatus: "Status",
        thActions: "Actions",
        loading: "Loading system data...",
        reviewBtn: "Review Details",
        modalTitlePrefix: "Client Request: ",
        btnAccept: "Accept Request & Notify",
        btnReject: "Reject & Apologize",
        btnClose: "Close",
        company: "Corporate / Company",
        individual: "Individual",
        promptText: "Enter office notes or fee details (will be emailed to the client):"
      }
    };

    let currentLang = localStorage.getItem('akh_intake_lang') || 'ar';

    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('akh_intake_lang', lang);
      const root = document.getElementById('htmlRoot');
      root.setAttribute('lang', lang);
      root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      document.getElementById('langSelect').value = lang;
      
      updateUIStrings();
      if (allRequests.length > 0) renderTable(allRequests);
    }

    function updateUIStrings() {
      const t = translations[currentLang];
      document.getElementById('pageTitle').innerText = t.pageTitle;
      document.getElementById('btnRefreshText').innerText = t.refresh;
      document.getElementById('btnLogoutText').innerText = t.logout;
      document.getElementById('statTitle1').innerText = t.stat1;
      document.getElementById('statTitle2').innerText = t.stat2;
      document.getElementById('statTitle3').innerText = t.stat3;
      document.getElementById('tableHeaderTitle').innerText = t.tableTitle;
      document.getElementById('searchInput').placeholder = t.searchPh;
      document.getElementById('thDate').innerText = t.thDate;
      document.getElementById('thName').innerText = t.thName;
      document.getElementById('thEntity').innerText = t.thEntity;
      document.getElementById('thType').innerText = t.thType;
      document.getElementById('thPhone').innerText = t.thPhone;
      document.getElementById('thStatus').innerText = t.thStatus;
      document.getElementById('thActions').innerText = t.thActions;
      document.getElementById('btnAcceptModal').innerText = t.btnAccept;
      document.getElementById('btnRejectModal').innerText = t.btnReject;
      document.getElementById('btnCloseModal').innerText = t.btnClose;
    }

    // إعدادات الأمان والمصادقة
    const MAX_ATTEMPTS = 5;
    const LOCKOUT_TIME = 15 * 60 * 1000;

    async function hashString(str) {
      const msgUint8 = new TextEncoder().encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    window.onload = function() {
      changeLanguage(currentLang);
      let lockoutData = JSON.parse(localStorage.getItem('akh_intake_lockout') || '{}');
      if (lockoutData.time && Date.now() < lockoutData.time) {
        const remainingMins = Math.ceil((lockoutData.time - Date.now()) / 60000);
        document.getElementById('loginBoxContainer').innerHTML = `
          <h2>Security Lockout</h2>
          <p style="color: #d32f2f; font-weight: 700;">Too many failed attempts. Please wait ${remainingMins} minutes.</p>
        `;
        return;
      }

      if (localStorage.getItem('akh_intake_auth') === 'true') {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('dashboardContent').style.display = 'block';
        loadData();
      } else {
        renderAuthBox();
      }
    };

    function renderAuthBox() {
      const container = document.getElementById('loginBoxContainer');
      const savedPinHash = localStorage.getItem('akh_intake_pin_hash');

      if (!savedPinHash) {
        container.innerHTML = `
          <h2>AKH Intake / First-time Setup</h2>
          <p>Enter your GitHub Personal Access Token and a 6-digit PIN to secure your dashboard.</p>
          <input type="password" id="setupToken" class="login-input" placeholder="GitHub Token (ghp_xxxx...)">
          <input type="password" id="setupPin" class="login-input" maxlength="6" placeholder="Set 6-digit PIN">
          <button class="login-btn" onclick="saveInitialSetup()">Encrypt & Save PIN 🔒</button>
          <div id="loginError" class="login-error"></div>
        `;
      } else {
        container.innerHTML = `
          <h2>AKH Intake / Secure Login</h2>
          <p>Restricted Area. Enter your 6-digit PIN to access the dashboard.</p>
          <input type="password" id="loginPin" class="login-input" maxlength="6" placeholder="6-digit PIN">
          <button class="login-btn" onclick="verifyLoginPIN()">Login 🔓</button>
          <div id="loginError" class="login-error"></div>
        `;
      }
    }

    async function saveInitialSetup() {
      const token = document.getElementById('setupToken').value.trim();
      const pin = document.getElementById('setupPin').value.trim();
      const errorDiv = document.getElementById('loginError');

      if (!token || pin.length !== 6) {
        errorDiv.style.display = 'block';
        errorDiv.innerText = "Please enter a valid GitHub Token and a 6-digit PIN.";
        return;
      }

      try {
        const res = await fetch('https://api.github.com/user', {
          headers: { 'Authorization': `token ${token}` }
        });
        if (!res.ok) throw new Error('Invalid Token');

        const pinHash = await hashString(pin);
        localStorage.setItem('akh_intake_pin_hash', pinHash);
        localStorage.setItem('akh_intake_token', token);
        localStorage.setItem('akh_intake_auth', 'true');

        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('dashboardContent').style.display = 'block';
        loadData();
      } catch (err) {
        errorDiv.style.display = 'block';
        errorDiv.innerText = "Invalid GitHub Token! Please verify.";
      }
    }

    async function verifyLoginPIN() {
      const pin = document.getElementById('loginPin').value.trim();
      const errorDiv = document.getElementById('loginError');
      const savedPinHash = localStorage.getItem('akh_intake_pin_hash');
      const enteredHash = await hashString(pin);

      if (enteredHash === savedPinHash) {
        localStorage.removeItem('akh_intake_attempts');
        localStorage.setItem('akh_intake_auth', 'true');
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('dashboardContent').style.display = 'block';
        loadData();
      } else {
        handleFailedAttempt();
      }
    }

    function handleFailedAttempt() {
      const errorDiv = document.getElementById('loginError');
      let attempts = parseInt(localStorage.getItem('akh_intake_attempts') || '0') + 1;
      localStorage.setItem('akh_intake_attempts', attempts);

      if (attempts >= MAX_ATTEMPTS) {
        const lockoutUntil = Date.now() + LOCKOUT_TIME;
        localStorage.setItem('akh_intake_lockout', JSON.stringify({ time: lockoutUntil }));
        errorDiv.style.display = 'block';
        errorDiv.innerText = "Maximum attempts reached. System locked for 15 minutes.";
      } else {
        errorDiv.style.display = 'block';
        errorDiv.innerText = `Incorrect PIN! Attempts remaining: ${MAX_ATTEMPTS - attempts}`;
      }
    }

    function logout() {
      localStorage.removeItem('akh_intake_auth');
      location.reload();
    }

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwB90LBE4uAyx5rQZ8tz5d_GBkY5gMQAdsW_xqZoseqb2C_Y6PqJi9LIlH1-LekQwbVow/exec";

    let allRequests = [];
    let currentSelectedRow = null;
    let currentClientEmail = "";
    let currentClientName = "";

    function loadData() {
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(response => {
          if (response.status === "success") {
            allRequests = response.data.reverse();
            renderTable(allRequests);
            updateStats(allRequests);
          }
        })
        .catch(err => {
          console.error("Error fetching data:", err);
          document.getElementById('tableBody').innerHTML = `<tr><td colspan="7" style="text-align: center; color: #d32f2f; padding: 20px;">Error loading data from server.</td></tr>`;
        });
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      const t = translations[currentLang];
      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 30px; color: #64748b;">لا توجد طلبات / No requests found.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(item => {
        let badgeClass = "badge-pending";
        if (item.status.includes("مقبول") || item.status.includes("أتعاب") || item.status.toLowerCase().includes("accept")) badgeClass = "badge-accepted";
        if (item.status.includes("مرفوض") || item.status.toLowerCase().includes("reject")) badgeClass = "badge-rejected";

        let entityText = item.entityType === 'company' ? t.company : t.individual;

        return `
          <tr>
            <td>${new Date(item.timestamp).toLocaleString(currentLang === 'ar' ? 'ar-IQ' : 'en-US')}</td>
            <td style="font-weight: 800;">${item.fullName}</td>
            <td>${entityText}</td>
            <td>${item.consultType}</td>
            <td>${item.phone}</td>
            <td><span class="badge ${badgeClass}">${item.status}</span></td>
            <td>
              <button class="action-btn" onclick='openDetail(${JSON.stringify(item)})'>${t.reviewBtn}</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function updateStats(data) {
      document.getElementById('totalCount').innerText = data.length;
      document.getElementById('pendingCount').innerText = data.filter(i => i.status.includes('قيد المراجعة') || i.status.toLowerCase().includes('pending')).length;
      document.getElementById('acceptedCount').innerText = data.filter(i => i.status.includes('مقبول') || i.status.includes('أتعاب') || i.status.toLowerCase().includes('accept')).length;
    }

    function filterTable() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = allRequests.filter(item => 
        item.fullName.toLowerCase().includes(query) || 
        item.phone.includes(query) ||
        item.email.toLowerCase().includes(query)
      );
      renderTable(filtered);
    }

    function openDetail(item) {
      currentSelectedRow = item.rowId;
      currentClientEmail = item.email;
      currentClientName = item.fullName;
      const t = translations[currentLang];

      document.getElementById('modalTitle').innerText = t.modalTitlePrefix + item.fullName;
      
      const content = document.getElementById('modalContent');
      content.innerHTML = `
        <div class="detail-item"><label>${currentLang==='ar'?'الاسم الكامل / الشركة':'Full Name / Company'}</label><div>${item.fullName}</div></div>
        <div class="detail-item"><label>${currentLang==='ar'?'الصفة القانونية':'Entity Status'}</label><div>${item.entityType === 'company' ? t.company : t.individual}</div></div>
        <div class="detail-item"><label>${currentLang==='ar'?'البريد الإلكتروني':'Email'}</label><div>${item.email}</div></div>
        <div class="detail-item"><label>${currentLang==='ar'?'رقم الهاتف / الواتساب':'Phone / WhatsApp'}</label><div>${item.phone}</div></div>
        <div class="detail-item"><label>${currentLang==='ar'?'الجنسية / الإقامة':'Citizenship / Residence'}</label><div>${item.citizenship} - ${item.residence}</div></div>
        <div class="detail-item"><label>${currentLang==='ar'?'طريقة الاستشارة المفضلة':'Consultation Method'}</label><div>${item.method}</div></div>
        <div class="detail-item"><label>${currentLang==='ar'?'تصنيف الاستشارة':'Consultation Type'}</label><div>${item.consultType}</div></div>
        <div class="detail-item"><label>${currentLang==='ar'?'حالة الطلب الحالية':'Current Status'}</label><div style="color: #b45309;">${item.status}</div></div>
        ${item.personalDetails ? `<div class="detail-item full-width"><label>${currentLang==='ar'?'البيانات الشخصية الإضافية':'Additional Personal Details'}</label><div>${item.personalDetails}</div></div>` : ''}
        ${item.idOrReg ? `<div class="detail-item full-width"><label>${currentLang==='ar'?'بيانات التأسيس / الرقم الوظيفي':'Incorporation / ID Data'}</label><div>${item.idOrReg}</div></div>` : ''}
        <div class="detail-item full-width"><label>${currentLang==='ar'?'شرح قضية الاستشارة بالتفصيل':'Consultation Details'}</label><div style="line-height: 1.6; font-weight: 600; color: #1e293b;">${item.details}</div></div>
      `;

      document.getElementById('detailModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.remove('active');
    }

    function updateRequestStatus(newStatus) {
      const t = translations[currentLang];
      let notes = prompt(t.promptText, currentLang === 'ar' ? "تمت مراجعة طلبكم، وتُقدر أتعاب الاستشارة القانونية بمبلغ ... يرجى تأكيد الموعد." : "Your request has been reviewed. Estimated legal consultation fees are... Please confirm.");
      if (notes === null) return;

      fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: "updateStatus",
          rowId: currentSelectedRow,
          status: newStatus,
          email: currentClientEmail,
          fullName: currentClientName,
          notes: notes
        })
      })
      .then(res => res.json())
      .then(response => {
        if (response.status === "success") {
          alert(currentLang === 'ar' ? "تم تحديث حالة الطلب وإرسال الإشعار للعميل بنجاح!" : "Status updated and notification sent successfully!");
          closeModal();
          loadData();
        } else {
          alert("Error updating status.");
        }
      })
      .catch(err => {
        console.error("Error:", err);
        alert("Server connection error.");
      });
    }
  </script>
</body>
</html>
