<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | نشر الآراء القانونية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', system-ui, sans-serif;
      background-color: #f4f6f9;
      color: #1a1a1a;
      padding: 25px 15px;
      display: flex;
      justify-content: center;
    }
    .panel {
      max-width: 680px;
      width: 100%;
      background: #ffffff;
      border-radius: 12px;
      padding: 30px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px solid #edf2f7;
      padding-bottom: 15px;
    }
    .logo-badge {
      font-size: 28px;
      font-weight: 800;
      color: #0b1a30;
      letter-spacing: 1px;
    }
    .logo-badge span { color: #d32f2f; }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #2d3748;
      margin-top: 5px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
      color: #2d3748;
    }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      transition: all 0.2s;
    }
    input[type="text"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #0b1a30;
      box-shadow: 0 0 0 3px rgba(11,26,48,0.1);
    }
    textarea {
      resize: vertical;
      min-height: 180px;
      line-height: 1.7;
    }
    .btn-publish {
      width: 100%;
      padding: 14px;
      background-color: #0b1a30;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(11,26,48,0.25);
      transition: background-color 0.2s;
    }
    .btn-publish:active {
      background-color: #1a365d;
      transform: scale(0.99);
    }
    .settings-box {
      background: #edf2f7;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
    }
    .settings-title {
      font-size: 13px;
      font-weight: 700;
      color: #4a5568;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }
    #settingsFields {
      margin-top: 12px;
    }
    .alert {
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    .alert-success { background-color: #def7ec; color: #03543f; }
    .alert-error { background-color: #fde8e8; color: #9b1c1c; }
    .hint {
      font-size: 12px;
      color: #718096;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="panel">
    <div class="header">
      <div class="logo-badge">A<span>K</span>H</div>
      <h1>إدارة ونشر الآراء القانونية</h1>
    </div>

    <div id="statusAlert" class="alert"></div>

    <div class="settings-box">
      <div class="settings-title" onclick="toggleSettings()">
        <span>⚙️ إعدادات الربط السري مع الموقع (اضغط هنا)</span>
        <span id="toggleIcon">▼</span>
      </div>
      <div id="settingsFields" style="display: none;">
        <div class="form-group" style="margin-top: 10px;">
          <label>مفتاح الأمان الخاص بك (GitHub Token):</label>
          <input type="text" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" dir="ltr">
          <p class="hint">يُحفظ بأمان داخل متصفح جهازك فقط ولا يراه أحد غيرك.</p>
        </div>
      </div>
    </div>

    <form id="articleForm">
      <div class="form-group">
        <label>عنوان المقال أو الدراسة:</label>
        <input type="text" id="title" placeholder="مثال: إجراءات تأسيس الشركات المحدودة في القانون العراقي" required>
      </div>

      <div class="form-group">
        <label>الفرع / التخصص القانوني:</label>
        <select id="category">
          <option value="قانون الشركات والتجارة">قانون الشركات والتجارة</option>
          <option value="العلامات التجارية والملكية الفكرية">العلامات التجارية والملكية الفكرية</option>
          <option value="الدعاوى المدنية والتعويضات">الدعاوى المدنية والتعويضات</option>
          <option value="القضايا الجزائية والدفاع الجنائي">القضايا الجزائية والدفاع الجنائي</option>
          <option value="العمل والإقامة والضمان الاجتماعي">العمل والإقامة والضمان الاجتماعي</option>
        </select>
      </div>

      <div class="form-group">
        <label>الموجز لمحركات البحث (SEO Snippet):</label>
        <input type="text" id="summary" placeholder="سطر ونصف يلخص مضمون الدراسة ليظهر في نتائج Google" required>
      </div>

      <div class="form-group">
        <label>نص الدراسة أو التحليل القانوني:</label>
        <textarea id="content" placeholder="انسخ نص المقال من Notion أو Word والصقه هنا مباشرة..." required></textarea>
      </div>

      <button type="submit" id="submitBtn" class="btn-publish">نـشـر الـمـقـال الآن</button>
    </form>
  </div>

  <script>
    const REPO_OWNER = 'akjassem-netizen';
    const REPO_NAME = 'Site';
    const FILE_PATH = 'insights.html';

    window.onload = function() {
      const savedToken = localStorage.getItem('akh_gh_token');
      if (savedToken) {
        document.getElementById('ghToken').value = savedToken;
      } else {
        document.getElementById('settingsFields').style.display = 'block';
      }
    };

    function toggleSettings() {
      const fields = document.getElementById('settingsFields');
      fields.style.display = fields.style.display === 'none' ? 'block' : 'none';
    }

    function utf8_to_b64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    function b64_to_utf8(b64) {
      const binary = atob(b64.replace(/\s/g, ''));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    }

    function showAlert(msg, isSuccess) {
      const el = document.getElementById('statusAlert');
      el.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
      el.innerText = msg;
      el.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('articleForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const token = document.getElementById('ghToken').value.trim();
      if (!token) {
        showAlert('يرجى وضع مفتاح الأمان في خانة الإعدادات أولاً.', false);
        document.getElementById('settingsFields').style.display = 'block';
        return;
      }
      localStorage.setItem('akh_gh_token', token);

      const title = document.getElementById('title').value.trim();
      const category = document.getElementById('category').value;
      const summary = document.getElementById('summary').value.trim();
      const content = document.getElementById('content').value.trim();
      const date = new Date().toLocaleDateString('ar-IQ', { year: 'numeric', month: 'long', day: 'numeric' });

      const btn = document.getElementById('submitBtn');
      btn.innerText = 'جارٍ النشر وتحديث الموقع...';
      btn.disabled = true;

      try {
        const getUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
        const res = await fetch(getUrl, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) throw new Error('تعذر الوصول إلى صفحة المقالات. تأكد من صحة المفتاح.');
        const fileData = await res.json();
        let html = b64_to_utf8(fileData.content);

        const articleHtml = `
    <article style="border: 1px solid #e2e8f0; border-radius: 10px; padding: 22px; margin-bottom: 28px; text-align: right; background: #fafafa;">
      <div style="font-size: 13px; color: #d32f2f; font-weight: 700; margin-bottom: 6px;">${category} • ${date}</div>
      <h2 style="font-size: 20px; font-weight: 800; color: #0b1a30; margin-bottom: 12px; line-height: 1.4;">${title}</h2>
      <p style="font-size: 15px; color: #4a5568; line-height: 1.8; margin-bottom: 15px;">${summary}</p>
      <div style="font-size: 15px; color: #2d3748; line-height: 1.9; white-space: pre-line; border-top: 1px dashed #cbd5e0; padding-top: 15px;">
        ${content}
      </div>
    </article>
        `;

        if (html.includes('(المقالات والبحوث الإجرائية قيد الإعداد والنشر قريباً)')) {
          html = html.replace('<p class="arabic-note">(المقالات والبحوث الإجرائية قيد الإعداد والنشر قريباً)</p>', '<div id="articles-feed"></div>');
        }

        if (html.includes('<div id="articles-feed">')) {
          html = html.replace('<div id="articles-feed">', '<div id="articles-feed">\n' + articleHtml);
        } else {
          html = html.replace('</div>\n</body>', articleHtml + '\n</div>\n</body>');
        }

        const putRes = await fetch(getUrl, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `نشر مقال: ${title}`,
            content: utf8_to_b64(html),
            sha: fileData.sha
          })
        });

        if (!putRes.ok) throw new Error('فشل حفظ المقال. يرجى مراجعة الصلاحيات.');

        showAlert('تم نشر المقال بنجاح! سيظهر على موقعك خلال ثوانٍ معدودة.', true);
        document.getElementById('title').value = '';
        document.getElementById('summary').value = '';
        document.getElementById('content').value = '';
      } catch (err) {
        showAlert(err.message, false);
      } finally {
        btn.innerText = 'نـشـر الـمـقـال الآن';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
