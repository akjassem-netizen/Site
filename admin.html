<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم والتحرير - الآراء والرؤى القانونية | AKH Law Office</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', system-ui, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      border-top: 5px solid #c5a059;
      margin-top: 20px;
    }

    .brand-logo {
      text-align: center;
      margin-bottom: 25px;
      direction: ltr;
    }
    .brand-logo .akh {
      font-size: 38px;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: 4px;
      line-height: 1;
    }
    .brand-logo .akh .red-k { color: #dc2626; }
    .brand-logo .sub-title {
      font-size: 12px;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: 3px;
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .brand-logo .sub-title .slash { color: #dc2626; font-weight: 900; font-size: 15px; }

    .page-title {
      text-align: center;
      font-size: 20px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 25px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    /* نماذج الإدخال */
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .form-input, .form-textarea, .form-select {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      color: #0f172a;
      outline: none;
      transition: border-color 0.3s;
      background: #f8fafc;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: #c5a059;
      background: #ffffff;
    }
    .form-textarea {
      resize: vertical;
      min-height: 130px;
    }

    .btn-submit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #0f172a;
      color: white;
      padding: 14px 28px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 15px rgba(15, 23, 42, 0.15);
      transition: background 0.3s;
      font-family: 'Cairo', sans-serif;
    }
    .btn-submit:hover { background: #c5a059; color: #0f172a; }

    /* قائمة المقالات المنشورة */
    .insights-manage-section {
      margin-top: 40px;
      border-top: 2px dashed #e2e8f0;
      padding-top: 25px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 15px;
    }
    .insight-item-admin {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }
    .insight-info h4 {
      font-size: 15px;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .insight-info span {
      font-size: 12px;
      color: #64748b;
    }
    .btn-delete {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      font-family: 'Cairo', sans-serif;
    }
    .btn-delete:hover { background: #dc2626; }

    .nav-links {
      text-align: center;
      margin-top: 20px;
    }
    .nav-links a {
      color: #64748b;
      text-decoration: none;
      font-size: 13px;
      font-weight: 650;
    }
    .nav-links a:hover { color: #0f172a; text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand-logo">
      <div class="akh">A<span class="red-k">K</span>H</div>
      <div class="sub-title"><span class="slash">/</span><span>ADMIN DASHBOARD</span></div>
    </div>
    
    <div class="page-title">إدارة ونشر الآراء والرؤى القانونية (Insights)</div>
    
    <form id="insightForm" onsubmit="saveInsight(event)">
      <div class="form-group">
        <label class="form-label">عنوان الرأي أو المقال القانوني</label>
        <input type="text" id="insightTitle" class="form-input" placeholder="مثال: الآثار القانونية لتأسيس الشركات الأجنبية في العراق..." required>
      </div>

      <div class="form-group">
        <label class="form-label">تصنيف المقال / القسم</label>
        <select id="insightCategory" class="form-select">
          <option value="تأسيس الشركات">تأسيس الشركات والاستثمار</option>
          <option value="القضاء والتقاضي">التمثيل القضائي والتقاضي</option>
          <option value="العقود والالتزامات">العقود والالتزامات التجارية</option>
          <option value="الضرائب والمالية">الاستشارات الضريبية والمالية</option>
          <option value="الملكية الفكرية">العلامات التجارية والملكية الفكرية</option>
          <option value="الأحوال الشخصية">الأحوال الشخصية والأسرية</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">نبذة مختصرة (تظهر في الواجهة الرئيسية)</label>
        <textarea id="insightSummary" class="form-textarea" style="min-height: 80px;" placeholder="اكتب ملخصاً مركزاً يوضح أهمية الفكرة القانونية..." required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">نص المقال أو الرأي القانوني الكامل</label>
        <textarea id="insightContent" class="form-textarea" placeholder="اكتب التفاصيل القانونية والمادة القانونية والتحليل المهني..." required></textarea>
      </div>

      <button type="submit" class="btn-submit">
        <span>🚀 نشر الرأي القانوني فوراً</span>
      </button>
    </form>

    <div class="insights-manage-section">
      <div class="section-title">الأرآء والرؤى المنشورة حالياً</div>
      <div id="adminInsightsList">
        </div>
    </div>

    <div class="nav-links">
      <a href="insights.html">← الانتقال إلى صفحة الآراء العامة</a> | 
      <a href="https://akjassem.com">العودة إلى الرئيسية</a>
    </div>
  </div>

  <script>
    // تحميل وعرض المقالات عند فتح الصفحة
    window.addEventListener('DOMContentLoaded', () => {
      renderAdminInsights();
    });

    function saveInsight(e) {
      e.preventDefault();
      
      const title = document.getElementById('insightTitle').value.trim();
      const category = document.getElementById('insightCategory').value;
      const summary = document.getElementById('insightSummary').value.trim();
      const content = document.getElementById('insightContent').value.trim();
      const date = new Date().toLocaleDateString('ar-IQ', { year: 'numeric', month: 'long', day: 'numeric' });

      const newInsight = {
        id: Date.now(),
        title,
        category,
        summary,
        content,
        date
      };

      // جلب المقالات القديمة من localStorage
      let insights = JSON.parse(localStorage.getItem('akhInsights')) || [];
      insights.unshift(newInsight); // إضافة المقال الجديد في البداية

      // حفظ القائمة المحدثة
      localStorage.setItem('akhInsights', JSON.stringify(insights));

      // إعادة تعيين النموذج وتحديث القائمة
      document.getElementById('insightForm').reset();
      renderAdminInsights();
      alert('تم نشر الرأي القانوني بنجاح!');
    }

    function renderAdminInsights() {
      const listContainer = document.getElementById('adminInsightsList');
      let insights = JSON.parse(localStorage.getItem('akhInsights')) || [];

      if (insights.length === 0) {
        listContainer.innerHTML = '<p style="color: #64748b; font-size: 13px; text-align: center; padding: 10px;">لا توجد آراء منشورة حالياً.</p>';
        return;
      }

      listContainer.innerHTML = '';
      insights.forEach(item => {
        const div = document.createElement('div');
        div.className = 'insight-item-admin';
        div.innerHTML = `
          <div class="insight-info">
            <h4>${item.title}</h4>
            <span>📅 ${item.date} | 🏷️ ${item.category}</span>
          </div>
          <button class="btn-delete" onclick="deleteInsight(${item.id})">حذف</button>
        `;
        listContainer.appendChild(div);
      });
    }

    function deleteInsight(id) {
      if (confirm('هل أنت متأكد من حذف هذا الرأي القانوني؟')) {
        let insights = JSON.parse(localStorage.getItem('akhInsights')) || [];
        insights = insights.filter(item => item.id !== id);
        localStorage.setItem('akhInsights', JSON.stringify(insights));
        renderAdminInsights();
      }
    }
  </script>

</body>
</html>
