<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | نشر الآراء القانونية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', system-ui, sans-serif;
      background-color: #f7f9fc;
      color: #1a1a1a;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }
    .panel {
      max-width: 680px;
      width: 100%;
      background: #ffffff;
      border-radius: 14px;
      padding: 32px 22px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .brand {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 1.5px solid #edf2f7;
      padding-bottom: 20px;
    }
    .logo-text {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #0b1a30;
      line-height: 1;
    }
    .logo-text span { color: #d32f2f; }
    .sub-brand {
      font-size: 13px;
      font-weight: 700;
      color: #111;
      letter-spacing: 3px;
      margin-top: 8px;
    }
    .sub-brand span { color: #d32f2f; margin-left: 3px; }
    .est {
      font-size: 10px;
      color: #777;
      letter-spacing: 2px;
      margin-top: 4px;
    }
    h1 {
      font-size: 19px;
      font-weight: 700;
      color: #2d3748;
      margin-top: 15px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
      color: #2d3748;
    }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      transition: all 0.2s;
      background-color: #fff;
    }
    input[type="text"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #0b1a30;
      box-shadow: 0 0 0 3px rgba(11,26,48,0.1);
    }
    textarea {
      resize: vertical;
      min-height: 180px;
      line-height: 1.7;
    }
    .btn-publish {
      width: 100%;
      padding: 14px;
      background-color: #0b1a30;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(11,26,48,0.2);
      transition: all 0.2s;
    }
    .btn-publish:active {
      background-color: #1a365d;
      transform: scale(0.99);
    }
    .settings-box {
      background: #edf2f7;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 22px;
    }
    .settings-title {
      font-size: 13px;
      font-weight: 700;
      color: #4a5568;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }
    #settingsFields {
      margin-top: 12px;
    }
    .alert {
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    .alert-success { background-color: #def7ec; color: #03543f; }
    .alert-error { background-color: #fde8e8; color: #9b1c1c; }
    .hint {
      font-size: 12px;
      color: #718096;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="panel">
    <div class="brand">
      <div class="logo-text">A<span>K</span>H</div>
      <div class="sub-brand"><span>/</span> LAW OFFICE</div>
      <div class="est">EST. 2014</div>
      <h1>إدارة ونشر الآراء القانونية</h1>
    </div>

    <div id="statusAlert" class="alert"></div>

    <div class="settings-box">
      <div class="settings-title" onclick="toggleSettings()">
        <span>⚙️ إعدادات الربط السري مع الموقع (اضغط هنا)</span>
        <span id="toggleIcon">▼</span>
      </div>
      <div id="settingsFields" style="display: none;">
        <div class="form-group" style="margin-top: 10px;">
          <label>مفتاح الأمان الخاص بك (GitHub Token):</label>
          <input type="text" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" dir="ltr">
          <p class="hint">يُحفظ بأمان داخل متصفح جهازك فقط ولن تحتاجه مرة ثانية.</p>
        </div>
      </div>
    </div>

    <form id="articleForm">
      <div class="form-group">
        <label>لغة المقال / Article Language:</label>
        <select id="articleLang" onchange="onLanguageChange()">
          <option value="ar" selected>العربية (Arabic)</option>
          <option value="en">English (الإنجليزية)</option>
        </select>
      </div>

      <div class="form-group">
        <label id="lblTitle">عنوان المقال أو الدراسة:</label>
        <input type="text" id="title" placeholder="مثال: إجراءات تأسيس الشركات المحدودة في القانون العراقي" required>
      </div>

      <div class="form-group">
        <label id="lblCategory">الفرع / التخصص القانوني:</label>
        <select id="categorySelect" onchange="onCategoryChange()">
          <option value="قانون الشركات والتجارة">قانون الشركات والتجارة</option>
          <option value="العلامات التجارية والملكية الفكرية">العلامات التجارية والملكية الفكرية</option>
          <option value="القانون العقاري والمعاملات العقارية">القانون العقاري والمعاملات العقارية</option>
          <option value="الدعاوى المدنية والتعويضات">الدعاوى المدنية والتعويضات</option>
          <option value="القضايا الجزائية والدفاع الجنائي">القضايا الجزائية والدفاع الجنائي</option>
          <option value="العمل والإقامة والضمان الاجتماعي">العمل والإقامة والضمان الاجتماعي</option>
          <option value="التحكيم ومنازعات العقود">التحكيم ومنازعات العقود</option>
          <option value="CUSTOM">✍️ تخصص آخر (كتابة يدوية)...</option>
        </select>
        <input type="text" id="customCategoryInput" style="display: none; margin-top: 8px;" placeholder="اكتب التخصص القانوني هنا بحرية...">
      </div>

      <div class="form-group">
        <label id="lblSummary">الموجز لمحركات البحث (SEO Snippet):</label>
        <input type="text" id="summary" placeholder="سطر ونصف يلخص مضمون الدراسة ليظهر في نتائج Google" required>
      </div>

      <div class="form-group">
        <label id="lblContent">نص الدراسة أو التحليل القانوني:</label>
        <textarea id="content" placeholder="انسخ نص المقال والصقه هنا مباشرة..." required></textarea>
      </div>

      <button type="submit" id="submitBtn" class="btn-publish">نـشـر الـمـقـال الآن</button>
    </form>
  </div>

  <script>
    const REPO_OWNER = 'akjassem-netizen';
    const REPO_NAME = 'Site';
    const FILE_PATH = 'insights.html';

    window.onload = function() {
      const savedToken = localStorage.getItem('akh_gh_token');
      if (savedToken) {
        document.getElementById('ghToken').value = savedToken;
      } else {
        document.getElementById('settingsFields').style.display = 'block';
      }
    };

    function toggleSettings() {
      const fields = document.getElementById('settingsFields');
      fields.style.display = fields.style.display === 'none' ? 'block' : 'none';
    }

    function onCategoryChange() {
      const select = document.getElementById('categorySelect');
      const customInput = document.getElementById('customCategoryInput');
      if (select.value === 'CUSTOM') {
        customInput.style.display = 'block';
        customInput.required = true;
        customInput.focus();
      } else {
        customInput.style.display = 'none';
        customInput.required = false;
      }
    }

    function onLanguageChange() {
      const lang = document.getElementById('articleLang').value;
      const isEn = lang === 'en';
      
      const title = document.getElementById('title');
      const summary = document.getElementById('summary');
      const content = document.getElementById('content');
      const customCat = document.getElementById('customCategoryInput');

      if (isEn) {
        title.dir = 'ltr';
        summary.dir = 'ltr';
        content.dir = 'ltr';
        customCat.dir = 'ltr';
        title.placeholder = "e.g. Setting up a Limited Liability Company in Iraq";
        summary.placeholder = "A brief 2-sentence summary for search engines...";
        content.placeholder = "Paste your English legal article or insights here...";
        customCat.placeholder = "Enter legal practice area in English...";
        document.getElementById('lblTitle').innerText = "عنوان المقال (بالإنجليزي) / Article Title:";
        document.getElementById('lblCategory').innerText = "التخصص القانوني / Practice Area:";
        document.getElementById('lblSummary').innerText = "الموجز (SEO Summary):";
        document.getElementById('lblContent').innerText = "نص المقال / Content:";
      } else {
        title.dir = 'rtl';
        summary.dir = 'rtl';
        content.dir = 'rtl';
        customCat.dir = 'rtl';
        title.placeholder = "مثال: إجراءات تأسيس الشركات المحدودة في القانون العراقي";
        summary.placeholder = "سطر ونصف يلخص مضمون الدراسة ليظهر في نتائج Google";
        content.placeholder = "انسخ نص المقال والصقه هنا مباشرة...";
        customCat.placeholder = "اكتب التخصص القانوني هنا بحرية...";
        document.getElementById('lblTitle').innerText = "عنوان المقال أو الدراسة:";
        document.getElementById('lblCategory').innerText = "الفرع / التخصص القانوني:";
        document.getElementById('lblSummary').innerText = "الموجز لمحركات البحث (SEO Snippet):";
        document.getElementById('lblContent').innerText = "نص الدراسة أو التحليل القانوني:";
      }
    }

    function utf8_to_b64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    function b64_to_utf8(b64) {
      const binary = atob(b64.replace(/\s/g, ''));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    }

    function showAlert(msg, isSuccess) {
      const el = document.getElementById('statusAlert');
      el.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
      el.innerText = msg;
      el.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('articleForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const token = document.getElementById('ghToken').value.trim();
      if (!token) {
        showAlert('يرجى لصق مفتاح الأمان في خانة الإعدادات أولاً.', false);
        document.getElementById('settingsFields').style.display = 'block';
        return;
      }
      localStorage.setItem('akh_gh_token', token);

      const lang = document.getElementById('articleLang').value;
      const isEn = lang === 'en';

      const title = document.getElementById('title').value.trim();
      const catSelect = document.getElementById('categorySelect');
      const customCat = document.getElementById('customCategoryInput').value.trim();
      const category = (catSelect.value === 'CUSTOM') ? customCat : catSelect.value;
      const summary = document.getElementById('summary').value.trim();
      const content = document.getElementById('content').value.trim();
      
      const date = isEn 
        ? new Date().toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' })
        : new Date().toLocaleDateString('ar-IQ', { year: 'numeric', month: 'long', day: 'numeric' });

      const btn = document.getElementById('submitBtn');
      btn.innerText = 'جارٍ النشر وتحديث الموقع...';
      btn.disabled = true;

      try {
        const getUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
        const res = await fetch(getUrl, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) throw new Error('تعذر الوصول إلى صفحة المقالات. تأكد من صحة المفتاح والصلاحيات.');
        const fileData = await res.json();
        let html = b64_to_utf8(fileData.content);

        const articleHtml = `
    <!-- ARTICLE_START -->
    <article style="border: 1px solid #e2e8f0; border-radius: 10px; padding: 22px; margin-bottom: 26px; text-align: ${isEn ? 'left' : 'right'}; direction: ${isEn ? 'ltr' : 'rtl'}; background: #fafafa; font-family: inherit;">
      <div style="font-size: 13px; color: #d32f2f; font-weight: 700; margin-bottom: 6px;">${category} • ${date}</div>
      <h2 style="font-size: 20px; font-weight: 800; color: #0b1a30; margin-bottom: 12px; line-height: 1.4;">${title}</h2>
      <p style="font-size: 15px; color: #4a5568; line-height: 1.8; margin-bottom: 15px;">${summary}</p>
      <div style="font-size: 15px; color: #2d3748; line-height: 1.9; white-space: pre-line; border-top: 1px dashed #cbd5e0; padding-top: 15px;">
        ${content}
      </div>
    </article>
        `;

        if (isEn) {
          if (html.includes('(Procedural insights & legal articles under preparation and forthcoming)')) {
            html = html.replace('<p class="english-note">(Procedural insights & legal articles under preparation and forthcoming)</p>', '<div id="english-feed">\n' + articleHtml + '\n</div>');
          } else if (html.includes('<div id="english-feed">')) {
            html = html.replace('<div id="english-feed">', '<div id="english-feed">\n' + articleHtml);
          } else {
            html = html.replace('</div>\n  </div>\n</body>', articleHtml + '\n</div>\n  </div>\n</body>');
          }
        } else {
          if (html.includes('(المقالات والبحوث الإجرائية قيد الإعداد والنشر قريباً)')) {
            html = html.replace('<p class="arabic-note">(المقالات والبحوث الإجرائية قيد الإعداد والنشر قريباً)</p>', '<div id="arabic-feed">\n' + articleHtml + '\n</div>');
          } else if (html.includes('<div id="arabic-feed">')) {
            html = html.replace('<div id="arabic-feed">', '<div id="arabic-feed">\n' + articleHtml);
          } else if (html.includes('<div id="articles-feed">')) {
            html = html.replace('<div id="articles-feed">', '<div id="articles-feed">\n' + articleHtml);
          } else {
            html = html.replace('<hr>', articleHtml + '\n<hr>');
          }
        }

        const putRes = await fetch(getUrl, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `نشر مقال (${lang}): ${title}`,
            content: utf8_to_b64(html),
            sha: fileData.sha
          })
        });

        if (!putRes.ok) throw new Error('فشل حفظ المقال. يرجى التأكد من صلاحية المفتاح.');

        showAlert('تم نشر المقال بنجاح! سيظهر على موقعك مباشرة.', true);
        document.getElementById('title').value = '';
        document.getElementById('summary').value = '';
        document.getElementById('content').value = '';
        document.getElementById('customCategoryInput').value = '';
      } catch (err) {
        showAlert(err.message, false);
      } finally {
        btn.innerText = 'نـشـر الـمـقـال الآن';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
