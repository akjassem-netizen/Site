<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>لوحة التحكم | نشر الآراء القانونية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', system-ui, sans-serif;
      background-color: #f7f9fc;
      color: #1a1a1a;
      padding: 8px 10px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .panel {
      max-width: 550px;
      width: 100%;
      background: #ffffff;
      border-radius: 10px;
      padding: 12px 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .brand-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #edf2f7;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }
    .logo-box {
      text-align: right;
      line-height: 1.1;
    }
    .logo-text {
      font-size: 24px;
      font-weight: 800;
      color: #0b1a30;
      letter-spacing: 1px;
    }
    .logo-text span { color: #d32f2f; }
    .sub-brand {
      font-size: 9px;
      font-weight: 700;
      color: #111;
      letter-spacing: 1.5px;
    }
    .sub-brand span { color: #d32f2f; }
    .page-title {
      font-size: 13px;
      font-weight: 800;
      color: #2d3748;
      text-align: left;
    }
    .settings-bar {
      background: #edf2f7;
      padding: 5px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 11px;
      font-weight: 700;
      color: #4a5568;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }
    #settingsFields {
      margin-top: 6px;
      padding-bottom: 4px;
    }
    .alert {
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 12px;
      display: none;
    }
    .alert-success { background-color: #def7ec; color: #03543f; }
    .alert-error { background-color: #fde8e8; color: #9b1c1c; }
    .form-group {
      margin-bottom: 7px;
    }
    .row {
      display: flex;
      gap: 8px;
    }
    .row .form-group {
      flex: 1;
    }
    label {
      display: block;
      font-weight: 700;
      font-size: 11.5px;
      margin-bottom: 2px;
      color: #2d3748;
    }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 6px 9px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12.5px;
      background-color: #fff;
    }
    input[type="text"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #0b1a30;
    }
    textarea {
      resize: none;
      height: 95px;
      line-height: 1.5;
    }
    .btn-publish {
      width: 100%;
      padding: 9px;
      background-color: #0b1a30;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-publish:active {
      background-color: #1a365d;
    }
  </style>
</head>
<body>

  <div class="panel">
    <div class="brand-bar">
      <div class="logo-box">
        <div class="logo-text">A<span>K</span>H</div>
        <div class="sub-brand"><span>/</span> LAW OFFICE • EST. 2014</div>
      </div>
      <div class="page-title" id="mainTitle">إدارة ونشر الآراء القانونية</div>
    </div>

    <div id="statusAlert" class="alert"></div>

    <div class="settings-bar" onclick="toggleSettings()">
      <span>⚙️ مفتاح الأمان (اضغط للإعداد)</span>
      <span id="toggleIcon">▼</span>
    </div>
    <div id="settingsFields" style="display: none;">
      <input type="text" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" dir="ltr" style="font-size: 11px;">
    </div>

    <form id="articleForm">
      <div class="row">
        <div class="form-group" style="max-width: 130px;">
          <label>اللغة / Language:</label>
          <select id="articleLang" onchange="onLanguageChange()">
            <option value="ar" selected>العربية</option>
            <option value="en">English</option>
          </select>
        </div>

        <div class="form-group">
          <label id="lblCategory">الفرع / التخصص:</label>
          <select id="categorySelect" onchange="onCategoryChange()">
            <option value="قانون الشركات والتجارة">قانون الشركات والتجارة</option>
            <option value="العلامات التجارية والملكية الفكرية">العلامات التجارية والملكية الفكرية</option>
            <option value="القانون العقاري والمعاملات العقارية">القانون العقاري والمعاملات العقارية</option>
            <option value="الدعاوى المدنية والتعويضات">الدعاوى المدنية والتعويضات</option>
            <option value="القضايا الجزائية والدفاع الجنائي">القضايا الجزائية والدفاع الجنائي</option>
            <option value="العمل والإقامة والضمان الاجتماعي">العمل والإقامة والضمان الاجتماعي</option>
            <option value="CUSTOM">✍️ تخصص آخر (يدوي)...</option>
          </select>
        </div>
      </div>

      <div class="form-group" id="customCatBox" style="display: none;">
        <input type="text" id="customCategoryInput" placeholder="اكتب التخصص القانوني هنا...">
      </div>

      <div class="form-group">
        <label id="lblTitle">عنوان المقال أو الدراسة:</label>
        <input type="text" id="title" placeholder="مثال: إجراءات تأسيس الشركات المحدودة" required>
      </div>

      <div class="form-group">
        <label id="lblSummary">الموجز لمحركات البحث (SEO):</label>
        <input type="text" id="summary" placeholder="سطر يلخص مضمون المقال لمحرك البحث Google" required>
      </div>

      <div class="form-group">
        <label id="lblContent">نص الدراسة أو التحليل القانوني:</label>
        <textarea id="content" placeholder="الصق نص المقال أو الدراسة هنا..." required></textarea>
      </div>

      <button type="submit" id="submitBtn" class="btn-publish">نـشـر الآن | Publish Now</button>
    </form>
  </div>

  <script>
    const REPO_OWNER = 'akjassem-netizen';
    const REPO_NAME = 'Site';
    const FILE_PATH = 'insights.html';

    window.onload = function() {
      const savedToken = localStorage.getItem('akh_gh_token');
      if (savedToken) {
        document.getElementById('ghToken').value = savedToken;
      } else {
        document.getElementById('settingsFields').style.display = 'block';
      }
    };

    function toggleSettings() {
      const fields = document.getElementById('settingsFields');
      fields.style.display = fields.style.display === 'none' ? 'block' : 'none';
    }

    function onCategoryChange() {
      const select = document.getElementById('categorySelect');
      const box = document.getElementById('customCatBox');
      const input = document.getElementById('customCategoryInput');
      if (select.value === 'CUSTOM') {
        box.style.display = 'block';
        input.required = true;
        input.focus();
      } else {
        box.style.display = 'none';
        input.required = false;
      }
    }

    function onLanguageChange() {
      const lang = document.getElementById('articleLang').value;
      const isEn = lang === 'en';
      
      const title = document.getElementById('title');
      const summary = document.getElementById('summary');
      const content = document.getElementById('content');
      const customCat = document.getElementById('customCategoryInput');
      const mainTitle = document.getElementById('mainTitle');
      const submitBtn = document.getElementById('submitBtn');

      if (isEn) {
        mainTitle.innerText = "Legal Insights Publishing";
        submitBtn.innerText = "Publish Article Now";
        title.dir = 'ltr';
        summary.dir = 'ltr';
        content.dir = 'ltr';
        customCat.dir = 'ltr';
        title.placeholder = "e.g. LLC Incorporation in Iraq";
        summary.placeholder = "Brief SEO snippet for Google search...";
        content.placeholder = "Paste your English article or insights here...";
        customCat.placeholder = "Enter practice area...";
        document.getElementById('lblTitle').innerText = "Article Title (EN):";
        document.getElementById('lblCategory').innerText = "Practice Area:";
        document.getElementById('lblSummary').innerText = "SEO Snippet:";
        document.getElementById('lblContent').innerText = "Article Content:";
      } else {
        mainTitle.innerText = "إدارة ونشر الآراء القانونية";
        submitBtn.innerText = "نـشـر الآن | Publish Now";
        title.dir = 'rtl';
        summary.dir = 'rtl';
        content.dir = 'rtl';
        customCat.dir = 'rtl';
        title.placeholder = "مثال: إجراءات تأسيس الشركات المحدودة";
        summary.placeholder = "سطر يلخص مضمون المقال لمحرك البحث Google";
        content.placeholder = "الصق نص المقال أو الدراسة هنا...";
        customCat.placeholder = "اكتب التخصص القانوني هنا...";
        document.getElementById('lblTitle').innerText = "عنوان المقال أو الدراسة:";
        document.getElementById('lblCategory').innerText = "الفرع / التخصص:";
        document.getElementById('lblSummary').innerText = "الموجز لمحركات البحث (SEO):";
        document.getElementById('lblContent').innerText = "نص الدراسة أو التحليل القانوني:";
      }
    }

    function utf8_to_b64(str) {
      const bytes = new TextEncoder().encode(str);
      let binary = '';
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    function b64_to_utf8(b64) {
      const binary = atob(b64.replace(/\s/g, ''));
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    }

    function showAlert(msg, isSuccess) {
      const el = document.getElementById('statusAlert');
      el.className = 'alert ' + (isSuccess ? 'alert-success' : 'alert-error');
      el.innerText = msg;
      el.style.display = 'block';
    }

    document.getElementById('articleForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const token = document.getElementById('ghToken').value.trim();
      if (!token) {
        showAlert('يرجى لصق المفتاح في خانة الإعدادات أولاً.', false);
        document.getElementById('settingsFields').style.display = 'block';
        return;
      }
      localStorage.setItem('akh_gh_token', token);

      const lang = document.getElementById('articleLang').value;
      const isEn = lang === 'en';

      const title = document.getElementById('title').value.trim();
      const catSelect = document.getElementById('categorySelect');
      const customCat = document.getElementById('customCategoryInput').value.trim();
      const category = (catSelect.value === 'CUSTOM') ? customCat : catSelect.value;
      const summary = document.getElementById('summary').value.trim();
      const content = document.getElementById('content').value.trim();
      
      const date = isEn 
        ? new Date().toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' })
        : new Date().toLocaleDateString('ar-IQ', { year: 'numeric', month: 'long', day: 'numeric' });

      const btn = document.getElementById('submitBtn');
      btn.innerText = isEn ? 'Publishing...' : 'جارٍ النشر...';
      btn.disabled = true;

      try {
        const getUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
        const res = await fetch(getUrl, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) throw new Error(isEn ? 'Token error. Check permissions.' : 'تعذر الوصول. تأكد من صحة المفتاح.');
        const fileData = await res.json();
        let html = b64_to_utf8(fileData.content);

        const articleHtml = `
    <!-- ARTICLE_START -->
    <article style="border: 1px solid #e2e8f0; border-radius: 10px; padding: 22px; margin-bottom: 26px; text-align: ${isEn ? 'left' : 'right'}; direction: ${isEn ? 'ltr' : 'rtl'}; background: #fafafa; font-family: inherit;">
      <div style="font-size: 13px; color: #d32f2f; font-weight: 700; margin-bottom: 6px;">${category} • ${date}</div>
      <h2 style="font-size: 20px; font-weight: 800; color: #0b1a30; margin-bottom: 12px; line-height: 1.4;">${title}</h2>
      <p style="font-size: 15px; color: #4a5568; line-height: 1.8; margin-bottom: 15px;">${summary}</p>
      <div style="font-size: 15px; color: #2d3748; line-height: 1.9; white-space: pre-line; border-top: 1px dashed #cbd5e0; padding-top: 15px;">
        ${content}
      </div>
    </article>
        `;

        if (isEn) {
          if (html.includes('(Procedural insights & legal articles under preparation and forthcoming)')) {
            html = html.replace('<p class="english-note">(Procedural insights & legal articles under preparation and forthcoming)</p>', '<div id="english-feed">\n' + articleHtml + '\n</div>');
          } else if (html.includes('<div id="english-feed">')) {
            html = html.replace('<div id="english-feed">', '<div id="english-feed">\n' + articleHtml);
          } else {
            html = html.replace('</div>\n  </div>\n</body>', articleHtml + '\n</div>\n  </div>\n</body>');
          }
        } else {
          if (html.includes('(المقالات والبحوث الإجرائية قيد الإعداد والنشر قريباً)')) {
            html = html.replace('<p class="arabic-note">(المقالات والبحوث الإجرائية قيد الإعداد والنشر قريباً)</p>', '<div id="arabic-feed">\n' + articleHtml + '\n</div>');
          } else if (html.includes('<div id="arabic-feed">')) {
            html = html.replace('<div id="arabic-feed">', '<div id="arabic-feed">\n' + articleHtml);
          } else if (html.includes('<div id="articles-feed">')) {
            html = html.replace('<div id="articles-feed">', '<div id="articles-feed">\n' + articleHtml);
          } else {
            html = html.replace('<hr>', articleHtml + '\n<hr>');
          }
        }

        const putRes = await fetch(getUrl, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Publish (${lang}): ${title}`,
            content: utf8_to_b64(html),
            sha: fileData.sha
          })
        });

        if (!putRes.ok) throw new Error('فشل حفظ المقال. يرجى مراجعة الصلاحيات.');

        showAlert(isEn ? 'Published successfully!' : 'تم نشر المقال بنجاح في موقعك!', true);
        document.getElementById('title').value = '';
        document.getElementById('summary').value = '';
        document.getElementById('content').value = '';
        document.getElementById('customCategoryInput').value = '';
      } catch (err) {
        showAlert(err.message, false);
      } finally {
        btn.innerText = isEn ? 'Publish Article Now' : 'نـشـر الآن | Publish Now';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
