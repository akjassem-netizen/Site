<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | نشر الآراء القانونية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', system-ui, sans-serif;
      background-color: #f7f9fc;
      color: #1a1a1a;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
    }
    .panel {
      max-width: 680px;
      width: 100%;
      background: #ffffff;
      border-radius: 14px;
      padding: 32px 22px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .brand {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 1.5px solid #edf2f7;
      padding-bottom: 20px;
    }
    .logo-text {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #0b1a30;
      line-height: 1;
    }
    .logo-text span { color: #d32f2f; }
    .sub-brand {
      font-size: 13px;
      font-weight: 700;
      color: #111;
      letter-spacing: 3px;
      margin-top: 8px;
    }
    .sub-brand span { color: #d32f2f; margin-left: 3px; }
    .est {
      font-size: 10px;
      color: #777;
      letter-spacing: 2px;
      margin-top: 4px;
    }
    h1 {
      font-size: 19px;
      font-weight: 700;
      color: #2d3748;
      margin-top: 15px;
      transition: all 0.2s;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
      color: #2d3748;
    }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      transition: all 0.2s;
      background-color: #fff;
    }
    input[type="text"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #0b1a30;
      box-shadow: 0 0 0 3px rgba(11,26,48,0.1);
    }
    textarea {
      resize: vertical;
      min-height: 180px;
      line-height: 1.7;
    }
    .btn-publish {
      width: 100%;
      padding: 14px;
      background-color: #0b1a30;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(11,26,48,0.2);
      transition: all 0.2s;
    }
    .btn-publish:active {
      background-color: #1a365d;
      transform: scale(0.99);
    }
    .settings-box {
      background: #edf2f7;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 22px;
    }
    .settings-title {
      font-size: 13px;
      font-weight: 700;
      color: #4a5568;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }
    #settingsFields {
      margin-top: 12px;
    }
    .alert {
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    .alert-success { background-color: #def7ec; color: #03543f; }
    .alert-error { background-color: #fde8e8; color: #9b1c1c; }
    .hint {
      font-size: 12px;
      color: #718096;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="panel">
    <div class="brand">
      <div class="logo-text">A<span>K</span>H</div>
      <div class="sub-brand"><span>/</span> LAW OFFICE</div>
      <div class="est">EST. 2014</div>
      <h1 id="mainTitle">إدارة ونشر الآراء القانونية</h1>
    </div>

    <div id="statusAlert" class="alert"></div>

    <div class="settings-box">
      <div class="settings-title" onclick="toggleSettings()">
        <span>⚙️ إعدادات الربط السري مع الموقع (اضغط هنا)</span>
        <span id="toggleIcon">▼</span>
      </div>
      <div id="settingsFields" style="display: none;">
        <div class="form-group" style="margin-top: 10px;">
          <label>مفتاح الأمان الخاص بك (GitHub Token):</label>
          <input type="text" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" dir="ltr">
          <p class="hint">يُحفظ بأمان داخل متصفح جهازك فقط ولن تحتاجه مرة ثانية.</p>
        </div>
      </div>
    </div>

    <form id="articleForm">
      <div class="form-group">
        <label>لغة المقال / Article Language:</label>
        <select id="articleLang" onchange="onLanguageChange()">
          <option value="ar" selected>العربية (Arabic)</option>
          <option value="en">English (الإنجليزية)</option>
        </select>
      </div>

      <div class="form-group">
        <label id="lblTitle">عنوان المقال أو الدراسة:</label>
        <input type="text" id="title" placeholder="مثال: إجراءات تأسيس الشركات المحدودة في القانون العراقي" required>
      </div>

      <div class="form-group">
        <label id="lblCategory">الفرع / التخصص القانوني:</label>
        <select id="categorySelect" onchange="onCategoryChange()">
          <option value="قانون الشركات والتجارة">قانون الشركات والتجارة</option>
          <option
