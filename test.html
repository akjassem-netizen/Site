<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتب المحامي علي كاظم الهاشمي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: #070f1e; color: #ffffff; scroll-behavior: smooth; }

    /* الهيدر التنفيذي العالمي (المطابق لمعايير iCover تماماً) */
    .icover-header {
      background: #070f1e;
      border-bottom: 2px solid #c5a059;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    /* الجهة اليمنى: تبديل اللغات مباشرة في الشريط الأزرق */
    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lang-select-bar {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(197, 160, 89, 0.4);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
    }
    .lang-select-bar option { background: #070f1e; color: #fff; }

    /* منتصف الشريط الأزرق: الشعار المبرمج الفخم */
    .header-center-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      background: #ffffff;
      padding: 4px 10px;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .hc-akh {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #070f1e;
      font-family: Arial, sans-serif;
      line-height: 1;
    }
    .hc-akh span { color: #d32f2f; }
    .hc-sub {
      font-size: 6px;
      font-weight: 800;
      color: #070f1e;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }
    .hc-sub span { color: #d32f2f; }

    /* الجهة اليسار: زر حجز موعد وقائمة القائمة المنسدلة */
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-booking-header {
      background: #c5a059;
      color: #070f1e;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 2px 8px rgba(197, 160, 89, 0.3);
      transition: all 0.2s;
    }
    .btn-booking-header:hover { background: #d4af37; }

    .menu-toggle {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 38px;
      height: 38px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .menu-toggle:hover { background: rgba(255, 255, 255, 0.15); }

    /* القائمة المنسدلة النظيفة */
    .dropdown-menu {
      position: absolute;
      top: 100%;
      right: 0;
      left: 0;
      background: #070f1e;
      border-bottom: 2.5px solid #c5a059;
      display: none;
      flex-direction: column;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      padding: 8px 0;
    }
    .dropdown-menu.active { display: flex; }
    .dropdown-menu a {
      color: #ffffff;
      padding: 12px 20px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.2s;
    }
    .dropdown-menu a:hover { background: rgba(197, 160, 89, 0.15); color: #c5a059; }

    /* التخطيط الرئيسي (Main Container) */
    .main-container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 30px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .main-container { grid-template-columns: 1fr; }
    }

    /* الصندوق الأيمن الثابت (Sticky Sidebar) بدون خلفية مربعة مزعجة، تصميم نظيف وفخم */
    .sticky-sidebar {
      position: sticky;
      top: 85px;
    }

    .hero-clean-box {
      text-align: right;
    }

    .hero-logo-banner {
      direction: ltr;
      unicode-bidi: embed;
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid rgba(197, 160, 89, 0.3);
      width: 100%;
    }

    .logo-akh-text {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      font-family: Arial, sans-serif;
      line-height: 1.1;
    }
    .logo-akh-text span { color: #d32f2f; }

    .logo-sub-text {
      font-size: 11px;
      font-weight: 800;
      color: #cbd5e1;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .logo-sub-text span { color: #d32f2f; }

    .logo-est-text {
      font-size: 9px;
      color: #94a3b8;
      font-weight: 700;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .hero-title {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.35;
      margin-bottom: 14px;
    }

    .hero-subtitle {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.85;
      margin-bottom: 25px;
      font-weight: 600;
      text-align: justify;
      text-justify: inter-word;
    }

    .hero-cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #c5a059;
      color: #070f1e;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(197, 160, 89, 0.3);
      transition: all 0.2s ease;
    }
    .hero-cta-btn:hover {
      background: #d4af37;
      transform: translateY(-2px);
    }

    /* مساحة الأقسام القادمة */
    .content-sections-area {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .content-card {
      background: #111b33;
      border: 1px solid rgba(197, 160, 89, 0.3);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    .content-card h3 {
      font-size: 20px;
      color: #c5a059;
      margin-bottom: 12px;
      font-weight: 800;
      border-bottom: 1px solid rgba(197, 160, 89, 0.2);
      padding-bottom: 10px;
    }

    .content-card p {
      font-size: 14.5px;
      color: #cbd5e1;
      line-height: 1.85;
      text-align: justify;
    }
  </style>
</head>

        <option value="es">Español</option>
        <option value="de">Deutsch</option>
        <option value="ku">کوردی</option>
      </select>
    </div>

      <div class="hc-sub"><span>/</span> LAW OFFICE</div>
