<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار الهيدر</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; }

    /* هيدر مطابق تماماً لنسق المنصات العالمية */
    .icover-header {
      background: #070f1e;
      border-bottom: 2px solid #c5a059;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
      background: #ffffff;
      border-radius: 4px;
      padding: 2px;
    }

    .brand-name {
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
    }
    .brand-name span {
      display: block;
      font-size: 10px;
      color: #c5a059;
      font-weight: 600;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action-top {
      background: #d32f2f;
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 4px;
      font-size: 12.5px;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header class="icover-header">
    <a href="test.html" class="brand-box">
      <img src="1000019530.jpg" alt="AKH Logo" class="brand-logo" onerror="this.style.display='none'">
      <div class="brand-name">
        مكتب المحامي علي كاظم الهاشمي
        <span>AKH LAW OFFICE</span>
      </div>
    </a>
    <div class="header-right">
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSdVxyld_U5Mdp-4RLcuA8HdQvAvlYWdd1fiQ8QAavwJj_Ev7w/viewform" target="_blank" class="btn-action-top">حجز موعد</a>
    </div>
  </header>

</body>
</html>
