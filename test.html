<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتب المحامي علي كاظم الهاشمي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; }

    /* الهيدر التنفيذي المطابق لنسق المنصات العالمية */
    .icover-header {
      background: #070f1e;
      border-bottom: 2px solid #c5a059;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    /* جهة اليمين: الشعار والاسم */
    .brand-box {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      object-fit: cover;
      background: #ffffff;
      border-radius: 4px;
      border: 1px solid #c5a059;
      padding: 2px;
    }

    .brand-name {
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
    }
    .brand-name span {
      display: block;
      font-size: 10px;
      color: #c5a059;
      font-weight: 600;
    }

    /* جهة اليسار: أزرار الحجز وقائمة الثلاث شخطات */
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-booking {
      background: #ffffff;
      color: #070f1e;
      border: 1px solid #c5a059;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .btn-booking:hover { background: #f1f5f9; }

    /* زر الثلاث شخطات (القائمة المنسدلة) */
    .menu-toggle {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 38px;
      height: 38px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* القائمة المنسدلة المخفية وتظهر عند الضغط */
    .dropdown-menu {
      position: absolute;
      top: 100%;
      right: 0;
      left: 0;
      background: #070f1e;
      border-bottom: 2px solid #c5a059;
      display: none;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .dropdown-menu.active {
      display: flex;
    }

    .dropdown-menu a {
      color: #ffffff;
      padding: 14px 20px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .dropdown-menu a:hover {
      background: rgba(197, 160, 89, 0.15);
      color: #c5a059;
    }

    /* منطقة الكفر (Hero Section) المماثلة للتدرج الأزرق */
    .hero-cover {
      background: linear-gradient(135deg, #070f1e 0%, #0f172a 100%);
      color: #ffffff;
      padding: 50px 20px;
      text-align: center;
      border-bottom: 4px solid #d32f2f;
    }

    .hero-cover h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .hero-cover p {
      font-size: 14px;
      color: #cbd5e1;
    }

    /* مساحة التمرير التجريبية */
    .scroll-test {
      padding: 40px 20px;
      text-align: center;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- الهيدر الرئيسي -->
  <header class="icover-header">
    <a href="test.html" class="brand-box">
      <img src="1000019530.jpg" alt="AKH Logo" class="brand-logo" onerror="this.style.display='none'">
      <div class="brand-name">
        مكتب المحامي علي كاظم
        <span>AKH LAW OFFICE</span>
      </div>
    </a>

    <div class="header-left">
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSdVxyld_U5Mdp-4RLcuA8HdQvAvlYWdd1fiQ8QAavwJj_Ev7w/viewform" target="_blank" class="btn-booking">حجز موعد</a>
      <!-- زر الثلاث شخطات -->
      <button class="menu-toggle" onclick="toggleMenu()" aria-label="القائمة">☰</button>
    </div>

    <!-- القائمة المنسدلة -->
    <div id="dropdownMenu" class="dropdown-menu">
      <a href="test.html">الرئيسية</a>
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSdVxyld_U5Mdp-4RLcuA8HdQvAvlYWdd1fiQ8QAavwJj_Ev7w/viewform" target="_blank">حجز موعد استشارة</a>
      <a href="https://wa.me/9647702956021" target="_blank">محادثة واتساب</a>
    </div>
  </header>

  <!-- الكفر (Hero Section) -->
  <section class="hero-cover">
    <h1>مكتب المحامي علي كاظم الهاشمي</h1>
    <p>تمثيل قانوني رصين واستشارات تخصصية للشركات والأفراد</p>
  </section>

  <div class="scroll-test">
    <p>جرب تضغط على الثلاث شخطات فوق على اليسار، وجرب تنزل بالصفحة (سكرول) لتتأكد من سلاسة الحركة.</p>
  </div>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('dropdownMenu');
      menu.classList.toggle('active');
    }
  </script>

</body>
</html>
