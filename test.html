<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتب المحامي علي كاظم الهاشمي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: #0b132b; color: #ffffff; }

    /* الهيدر التنفيذي النظيف وغير المزدحم */
    .icover-header {
      background: #070f1e;
      border-bottom: 2px solid #c5a059;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title-mini {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-toggle {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .menu-toggle:hover { background: rgba(255, 255, 255, 0.15); }

    /* القائمة المنسدلة (تضم تبديل اللغات وروابط التنقل) */
    .dropdown-menu {
      position: absolute;
      top: 100%;
      right: 0;
      left: 0;
      background: #070f1e;
      border-bottom: 2.5px solid #c5a059;
      display: none;
      flex-direction: column;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      padding: 10px 0;
    }
    .dropdown-menu.active { display: flex; }

    .dropdown-section {
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .dropdown-section label {
      display: block;
      font-size: 12px;
      color: #c5a059;
      margin-bottom: 6px;
      font-weight: 700;
    }
    .lang-select-dropdown {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
    }
    .lang-select-dropdown option { background: #070f1e; color: #fff; }

    .dropdown-menu a {
      color: #ffffff;
      padding: 12px 20px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: background 0.2s;
    }
    .dropdown-menu a:hover { background: rgba(197, 160, 89, 0.15); color: #c5a059; }

    /* القسم الرئيسي الفخم (Hero Section) */
    .hero-cover-section {
      max-width: 750px;
      margin: 35px auto 45px;
      padding: 0 20px;
    }

    .hero-box {
      background: #ffffff;
      color: #070f1e;
      border: 1.5px solid #cbd5e1;
      border-radius: 16px;
      padding: 40px 30px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.3);
      border-top: 6px solid #070f1e;
      text-align: right;
    }

    /* الشعار الممتد أفقياً وبشكل مرتب ونظيف */
    .hero-logo-banner {
      direction: ltr;
      unicode-bidi: embed;
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 25px;
      padding-bottom: 18px;
      border-bottom: 1.5px solid #e2e8f0;
      width: 100%;
    }

    .logo-akh-text {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #070f1e;
      font-family: Arial, sans-serif;
      line-height: 1.1;
    }
    .logo-akh-text span { color: #d32f2f; }

    .logo-sub-text {
      font-size: 10px;
      font-weight: 800;
      color: #070f1e;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    .logo-sub-text span { color: #d32f2f; }

    .logo-est-text {
      font-size: 8px;
      color: #64748b;
      font-weight: 700;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .hero-title {
      font-size: 26px;
      font-weight: 900;
      color: #070f1e;
      line-height: 1.35;
      margin-bottom: 14px;
    }

    /* تنسيق النصوص المتساوية الحواف ومتناسقة بكل اللغات */
    .hero-subtitle {
      font-size: 15px;
      color: #334155;
      line-height: 1.85;
      margin-bottom: 28px;
      font-weight: 600;
      text-align: justify;
      text-justify: inter-word;
    }

    .hero-cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #070f1e;
      color: #ffffff;
      border: 1.5px solid #070f1e;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(7, 15, 30, 0.2);
      transition: all 0.2s ease;
    }
    .hero-cta-btn:hover {
      background: #c5a059;
      color: #070f1e;
      border-color: #c5a059;
    }
  </style>
</head>

    function changeLanguage(lang) {
      const root = document.getElementById('htmlRoot');
      root.setAttribute('lang', lang);
      root.setAttribute('dir', (lang === 'ar' || lang === 'ku') ? 'rtl' : 'ltr');

      const t = dictionary[lang] || dictionary['en'];

      document.getElementById('headerBrandTitle').innerText = t.brand;
      document.getElementById('langLabel').innerText = t.langLabel;
      document.getElementById('menuHome').innerText = t.home;
      document.getElementById('menuBook').innerText = t.bookConsult;
      document.getElementById('menuWhatsapp').innerText = t.whatsapp;
      document.getElementById('heroTitleText').innerText = t.title;
      document.getElementById('heroSubtitleText').innerText = t.subtitle;
      document.getElementById('heroCtaText').innerText = t.cta;
    }
