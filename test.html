<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتب المحامي علي كاظم الهاشمي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: #f8fafc; color: #1e293b; }

    /* الهيدر التنفيذي تماماً مثل نسق iCover */
    .icover-header {
      background: #070f1e;
      border-bottom: 2px solid #c5a059;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand-box {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    /* إطار أبيض فاخر للشعار يضمن ظهوره بوضوح تام على الخلفية الداكنة */
    .logo-frame {
      background: #ffffff;
      padding: 4px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .brand-logo-img {
      height: 35px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-booking {
      background: #ffffff;
      color: #070f1e;
      border: 1px solid #c5a059;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .btn-booking:hover { background: #f1f5f9; }

    .menu-toggle {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 38px;
      height: 38px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* القائمة المنسدلة (الثلاث شخطات) */
    .dropdown-menu {
      position: absolute;
      top: 100%;
      right: 0;
      left: 0;
      background: #070f1e;
      border-bottom: 2px solid #c5a059;
      display: none;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .dropdown-menu.active { display: flex; }
    .dropdown-menu a {
      color: #ffffff;
      padding: 14px 20px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .dropdown-menu a:hover { background: rgba(197, 160, 89, 0.15); color: #c5a059; }

    /* مستطيل اختيار اللغة المطابق لطلبك */
    .lang-container {
      max-width: 650px;
      margin: 30px auto 20px;
      padding: 0 16px;
    }

    .lang-card-box {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }

    .lang-label {
      font-size: 13.5px;
      font-weight: 700;
      color: #1e293b;
    }

    .lang-select-box {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1.5px solid #070f1e;
      background: #ffffff;
      color: #070f1e;
      font-size: 13px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
    }
  </style>
</head>
<body>

  <!-- الهيدر التنفيذي -->
  <header class="icover-header">
    <a href="test.html" class="brand-box">
      <div class="logo-frame">
        <img src="1000019530.jpg" alt="AKH Logo" class="brand-logo-img">
      </div>
    </a>

    <div class="header-left">
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSdVxyld_U5Mdp-4RLcuA8HdQvAvlYWdd1fiQ8QAavwJj_Ev7w/viewform" target="_blank" class="btn-booking">حجز موعد</a>
      <button class="menu-toggle" onclick="toggleMenu()" aria-label="القائمة">☰</button>
    </div>

    <div id="dropdownMenu" class="dropdown-menu">
      <a href="test.html">الرئيسية</a>
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSdVxyld_U5Mdp-4RLcuA8HdQvAvlYWdd1fiQ8QAavwJj_Ev7w/viewform" target="_blank">حجز موعد استشارة</a>
      <a href="https://wa.me/9647702956021" target="_blank">محادثة واتساب</a>
    </div>
  </header>

  <!-- مستطيل اختيار اللغة -->
  <div class="lang-container">
    <div class="lang-card-box">
      <span class="lang-label">اختر اللغة / Select Language</span>
      <select class="lang-select-box" onchange="alert('تم اختيار اللغة: ' + this.value)">
        <option value="ar">العربية (Arabic)</option>
        <option value="en">English</option>
        <option value="tr">Türkçe</option>
        <option value="zh">中文</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
        <option value="de">Deutsch</option>
        <option value="ku">کوردی</option>
      </select>
    </div>
  </div>

  <script>
    function toggleMenu() {
      const menu = document.getElementById('dropdownMenu');
      menu.classList.toggle('active');
    }
  </script>

</body>
</html>
