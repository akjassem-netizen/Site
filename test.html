<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتب المحامي علي كاظم الهاشمي | مكتب محاماة مرخص ومعتمد</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-navy: #070f1e;
      --accent-gold: #c5a059;
      --accent-red: #d32f2f;
      --bg-light: #f8fafc;
      --text-dark: #1e293b;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-dark);
    }

    /* الهيدر التنفيذي */
    .executive-header {
      background: var(--primary-navy);
      border-bottom: 2px solid var(--accent-gold);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-logo-img {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 6px;
      background: #fff;
      border: 1px solid var(--accent-gold);
    }

    .brand-title {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      line-height: 1.3;
    }
    .brand-title span { display: block; font-size: 10px; color: var(--accent-gold); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* زر الحجز السريع في أقصى اليسار */
    .btn-booking-top {
      background: var(--accent-red);
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
      box-shadow: 0 2px 10px rgba(211, 47, 47, 0.3);
    }
    .btn-booking-top:hover { opacity: 0.9; }

    .lang-select-top {
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.05);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .lang-select-top option { background: var(--primary-navy); color: #fff; }
  </style>
</head>
<body>

  <header class="executive-header">
    <a href="index.html" class="brand-container">
      <img src="1000019530.jpg" alt="AKH Logo" class="brand-logo-img" onerror="this.style.display='none'">
      <div class="brand-title">
        مكتب المحامي علي كاظم الهاشمي
        <span>AKH LAW OFFICE</span>
      </div>
    </a>
    <div class="header-actions">
      <select id="langSelect" class="lang-select-top" onchange="changeLanguage(this.value)">
        <option value="ar">العربية</option>
        <option value="en">English</option>
      </select>
      <!-- رابط الحجز الصحيح والموثق -->
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSdVxyld_U5Mdp-4RLcuA8HdQvAvlYWdd1fiQ8QAavwJj_Ev7w/viewform" target="_blank" class="btn-booking-top">حجز موعد</a>
    </div>
  </header>

  <script>
    function changeLanguage(lang) {
      const root = document.getElementById('htmlRoot');
      root.setAttribute('lang', lang);
      root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    }
  </script>
</body>
</html>
