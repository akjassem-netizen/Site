<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حجز موعد استشارة قانونية - مكتب المحامي علي كاظم الهاشمي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Cairo', sans-serif; background: #f4f6f9; color: #070f1e; }

    .icover-header {
      background: #070f1e;
      border-bottom: 3px solid #c5a059;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .back-btn { color: #fff; text-decoration: none; font-weight: 700; font-size: 14px; }
    .back-btn:hover { color: #c5a059; }

    .form-container {
      max-width: 800px;
      margin: 40px auto;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 20px;
      padding: 40px 35px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.06);
      border-top: 6px solid #c5a059;
    }

    /* مربع الشعار الأصلي المطابق للرئيسية */
    .brand-logo-box {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }
    .b-akh {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #070f1e;
      font-family: Arial, sans-serif;
      line-height: 1.1;
    }
    .b-akh .red-k { color: #d32f2f; }
    .b-sub {
      font-size: 10.5px;
      font-weight: 800;
      color: #070f1e;
      letter-spacing: 1.5px;
      margin-top: 4px;
    }
    .b-sub .red-slash { color: #d32f2f; }
    .b-est {
      font-size: 8.5px;
      color: #64748b;
      font-weight: 700;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    h1 { font-size: 22px; font-weight: 900; color: #070f1e; margin-bottom: 10px; text-align: start; }
    p.instructions { font-size: 14px; color: #475569; line-height: 1.7; margin-bottom: 25px; text-align: start; }

    .form-group { margin-bottom: 20px; text-align: start; }
    label { display: block; font-weight: 800; font-size: 13.5px; color: #070f1e; margin-bottom: 6px; }
    input[type="text"], input[type="email"], input[type="tel"], input[type="number"], select, textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Cairo', sans-serif;
      outline: none;
      background: #f8fafc;
      color: #070f1e;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: #c5a059; background: #fff; }
    textarea { resize: vertical; height: 110px; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    @media (max-width: 650px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-container { margin: 15px; padding: 25px 20px; }
    }

    .radio-group { display: flex; gap: 20px; margin-top: 5px; flex-wrap: wrap; }
    .radio-label { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13.5px; cursor: pointer; }

    .submit-btn {
      width: 100%;
      background: #070f1e;
      color: #ffffff;
      border: 1.5px solid #070f1e;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
    }
    .submit-btn:hover { background: #c5a059; color: #070f1e; border-color: #c5a059; }

    .conditional-section { display: none; }
    .conditional-section.active { display: block; }
  </style>

  <script>
    if (window.location.pathname.endsWith('.html')) {
      const cleanPath = window.location.pathname.replace('.html', '');
      window.history.replaceState({}, '', cleanPath + window.location.search + window.location.hash);
    }
  </script>
</head>
<body>

  <header class="icover-header">
    <a href="test.html" class="back-btn">&larr; العودة للرئيسية</a>
    <div style="color: #c5a059; font-weight: 900; font-size: 14px;">AKH LAW OFFICE</div>
  </header>

  <main class="form-container">
    <div class="brand-logo-box" dir="ltr">
      <div class="b-akh">A<span class="red-k">K</span>H</div>
      <div class="b-sub"><span class="red-slash">/</span> LAW OFFICE</div>
      <div class="b-est">EST. 2014</div>
    </div>

    <h1>استمارة طلب الاستشارة القانونية</h1>
    <p class="instructions">يرجى تعبئة النموذج أدناه بدقة ليتسنى لنا دراسة الطلب وتحديد الأتعاب وضبط موعد الاستشارة وفق الأطر المهنية.</p>

    <form id="consultationForm">

      <div class="form-group">
        <label>صفة وموقع الموكل *</label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="clientType" value="local" checked onclick="switchClientType('local')"> مقيم داخل العراق (محلي)</label>
          <label class="radio-label"><input type="radio" name="clientType" value="international" onclick="switchClientType('international')"> موكل أو شركة من خارج العراق (دولي)</label>
        </div>
      </div>

      <div class="form-group">
        <label>الصفة القانونية *</label>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="entityType" value="individual" checked> فرد (شخص طبيعي)</label>
          <label class="radio-label"><input type="radio" name="entityType" value="company"> شركة أو مؤسسة تجارية</label>
        </div>
      </div>

      <div class="form-group">
        <label id="nameLabel">الاسم الكامل *</label>
        <input type="text" id="fullName" required placeholder="أدخل الاسم الثلاثي أو اسم الشركة">
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>البريد الإلكتروني *</label>
          <input type="email" id="email" required placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label>رقم الهاتف / الواتساب *</label>
          <input type="tel" id="phone" required placeholder="07700000000">
        </div>
      </div>

      <div id="localFields" class="conditional-section active">
        <div class="form-grid">
          <div class="form-group">
            <label>الجنس *</label>
            <select id="gender">
              <option value="male">ذكر</option>
              <option value="female">أنثى</option>
            </select>
          </div>
          <div class="form-group">
            <label>العمر *</label>
            <input type="number" id="age" placeholder="مثال: 35">
          </div>
        </div>

        <div class="form-group">
          <label>عنوان السكن (المحافظة / المنطقة) *</label>
          <input type="text" id="address" placeholder="بغداد - الجادرية">
        </div>

        <div class="form-group">
          <label>التحصيل الدراسي *</label>
          <select id="education">
            <option value="university">شهادة جامعية أو عليا</option>
            <option value="highschool">شهادة ثانوية</option>
            <option value="other">غير ذلك</option>
          </select>
        </div>

        <div class="form-group">
          <label>العمل أو الوظيفة *</label>
          <input type="text" id="occupation" placeholder="اكتب وظيفتك أو نشاطك التجاري">
        </div>
      </div>

      <div id="intlFields" class="conditional-section">
        <div class="form-grid">
          <div class="form-group">
            <label>الجنسية / بلد التأسيس *</label>
            <input type="text" id="nationality" placeholder="مثال: بريطاني / شركة إماراتية">
          </div>
          <div class="form-group">
            <label>رقم جواز السفر أو تسجيل الشركة *</label>
            <input type="text" id="passportOrReg" placeholder="Passport No. / Reg. No.">
          </div>
        </div>

        <div class="form-group">
          <label>خدمة الترجمة والتنسيق أثناء الجلسة *</label>
          <select id="translationNeeded">
            <option value="no">لا، أستطيع المتابعة بشكل مباشر</option>
            <option value="yes">نعم، أرغب بأن يوفر المكتب مترجماً مختصاً للجلسة</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>طريقة تلقي الاستشارة المفضلة *</label>
        <select id="consultationMethod">
          <option value="office">زيارة المكتب (Office Visit)</option>
          <option value="phone">مكالمة هاتفية (Phone Call)</option>
          <option value="online">عبر الإنترنت وتطبيقات التواصل (Online / Video)</option>
        </select>
      </div>

      <div class="form-group">
        <label>نوع الاستشارة أو التصنيف القانوني *</label>
        <select id="consultationType">
          <option value="corporate">القضايا التجارية والشركات واستثمار أجنبي</option>
          <option value="civil_realestate">الدعاوى المدنية والعقارية</option>
          <option value="criminal">الدعاوى الجزائية والجنائية</option>
          <option value="personal">الأحوال الشخصية (أسرة، طلاق، إرث)</option>
          <option value="other">أخرى / استشارة عامة</option>
        </select>
      </div>

      <div class="form-group">
        <label>شرح قضيتك أو موضوع الاستشارة بالتفصيل *</label>
        <textarea id="consultationDetails" placeholder="اشرح الوقائع باختصار ليتسنى لنا دراستها بدقة..."></textarea>
      </div>

      <button type="submit" class="submit-btn">إرسال الطلب للمراجعة القانونية &larr;</button>
    </form>
  </main>

  <script>
    function switchClientType(type) {
      const localSec = document.getElementById('localFields');
      const intlSec = document.getElementById('intlFields');
      const nameLabel = document.getElementById('nameLabel');

      if (type === 'local') {
        localSec.classList.add('active');
        intlSec.classList.remove('active');
        nameLabel.innerText = "الاسم الكامل *";
      } else {
        localSec.classList.remove('active');
        intlSec.classList.add('active');
        nameLabel.innerText = "الاسم الكامل / اسم الشركة الأجنبية *";
      }
    }

    document.getElementById('consultationForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert("تم استلام طلبكم بنجاح وهو الآن قيد الفحص والمراجعة القانونية.");
    });
  </script>

</body>
</html>
